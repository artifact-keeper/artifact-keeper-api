    ArtifactResponse:
      type: object
      required:
      - id
      - repository_key
      - path
      - name
      - size_bytes
      - checksum_sha256
      - content_type
      - download_count
      - created_at
      - analyzable
      - quarantine_status
      properties:
        analyzable:
          type: boolean
          description: 'Whether this artifact can have an SBOM generated or a security scan

            run against it. `false` for proxy-cached (Remote) objects: those are

            listed with a synthetic, SHA-256-derived id (see

            [`cached_artifact_id`]) and have no row in the `artifacts` table

            (#1280/#1278), so SBOM/scan lookups by `artifacts.id` cannot resolve

            them and `sbom_documents`/`scan_results` cannot reference them.

            `true` for hosted artifacts, which carry a real DB id. The web UI

            uses this to hide/disable the "Generate SBOM" / "Scan" actions where

            they cannot work; clients that predate the field should treat an

            absent value as `true` so hosted artifacts are never hidden. (#2227)'
        cache_cached_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the proxy cache entry for this artifact was last written.

            Only populated for Remote (proxy) repositories whose proxy service is

            configured AND that have a cache-metadata blob for this path. None

            for Local / Virtual / Staging repos and for Remote repos whose cache

            hasn''t been populated yet (e.g. an artifact that exists as a DB row

            from a direct upload but has never been fetched through the proxy).

            (#1541)'
        cache_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the proxy cache entry for this artifact will expire and be

            re-validated against upstream. Same gating as `cache_cached_at`. (#1541)'
        checksum_sha256:
          type: string
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
        download_count:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        metadata:
          type:
          - object
          - 'null'
        name:
          type: string
        path:
          type: string
        quarantine_status:
          type: string
          description: "Per-artifact quarantine state so a client/operator can tell which\nlisted artifacts are held for security\
            \ review (#2940). Always\nserialized so the listing never hides the control:\n- `\"quarantined\"` — held pending\
            \ review; downloads return 409 (until\n  any `quarantine_until` lapses),\n- `\"rejected\"` — terminally blocked\
            \ by an admin,\n- a scan-lifecycle state (`\"clean\"`, `\"flagged\"`, `\"unscanned\"`,\n  `\"released\"`),\n-\
            \ `\"not_quarantined\"` — the explicit default when the row carries no\n  quarantine state, so clients never have\
            \ to treat a missing value as\n  a state.\n\nThe human-readable *reason* is intentionally NOT surfaced here: it\
            \ is\nper-artifact security detail disclosed only by the authenticated,\nrepository-visibility-checked `GET /api/v1/quarantine/{id}`\
            \ (#2912),\nwhereas this listing is reachable anonymously on public repositories."
        quarantine_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When a timed quarantine hold lapses and the artifact becomes

            downloadable again. `None` for a permanent (admin) quarantine and for

            artifacts that are not quarantined. (#2940)'
        repository_key:
          type: string
        revision:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Server-assigned revision number for repositories with first-class

            versioning enabled (#2367). `None` for non-versioned repositories and

            for coordinates with no recorded history.'
        size_bytes:
          type: integer
          format: int64
        uploaded_by:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Id of the user that uploaded this artifact (#3271), mirroring

            [`ArtifactVersionResponse::uploaded_by`] (#2397). Always serialized —

            `null` for anonymous/unknown uploads and for proxy-cached objects,

            which have no `artifacts` row — so the UI can rely on the key being

            present.'
        uploaded_by_username:
          type:
          - string
          - 'null'
          description: 'Display name for [`Self::uploaded_by`], resolved server-side so the UI

            does not have to follow a bare UUID with an admin-only user lookup

            (#3271). `null` whenever `uploaded_by` is `null`, and also when the

            referenced user row no longer exists (a deleted account leaves the id

            on the artifact). Populated by the listing and per-artifact metadata

            endpoints; other responses that build an `ArtifactResponse` leave it

            unresolved.'
        version:
          type:
          - string
          - 'null'
        version_label:
          type:
          - string
          - 'null'
          description: 'Optional human tag recorded for this revision (from the

            `X-Artifact-Version` upload header). Only populated alongside

            `revision`.'
    ArtifactStatsResponse:
