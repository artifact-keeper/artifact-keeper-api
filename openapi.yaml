          `package-lock.json`, `Cargo.lock`, `poetry.lock`, `uv.lock`).'
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: 'Environment name within the repository. Defaults to the lockfile''s

          base file name. Re-ingesting an existing name replaces its graph.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        description: Raw lockfile bytes (pixi.lock, conda-lock.yml, package-lock.json, Cargo.lock, poetry.lock, uv.lock)
        content:
          application/octet-stream:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Environment replaced (same name re-ingested)
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Environment stored
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unrecognized, unhandled or unparseable lockfile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Repository write permission required
          content:
            application/json:
