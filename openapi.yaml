    DtStatusResponse:
      type: object
      description: "Dependency-Track integration status surfaced to the frontend.\n\n`healthy` is the boolean the existing\
        \ UI already binds to. The new\n`error_status` and `error_message` fields let the UI distinguish a\ngenuine \"DT replied\
        \ OK with no findings\" state from \"DT is down or\nmisconfigured\" (issue #963). When `healthy = true` both error\
        \ fields\nare None; when `healthy = false`:\n  - `error_status = Some(401)`: auth failure (check API key)\n  - `error_status\
        \ = Some(5xx)`: upstream is broken\n  - `error_status = None`:     transport failure (DT pod unreachable)\n  - `error_message`:\
        \           operator-facing failure description"
      required:
