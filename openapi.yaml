      - source_type
      - capabilities
      - resource_limits
      - installed_at
      - updated_at
      properties:
        author:
          type:
          - string
          - 'null'
        capabilities:
          type: object
        description:
          type:
          - string
          - 'null'
        display_name:
          type: string
        enabled_at:
          type:
          - string
          - 'null'
          format: date-time
        homepage:
