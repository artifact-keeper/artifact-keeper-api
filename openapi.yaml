  /api/v1/users/{id}/roles:
    get:
      tags:
      - users
      summary: Get user roles.
      description: 'Lists the `user_roles` rows [`assign_role`] writes, together with each

        role''s `permissions` array. Those capabilities describe the ROLE, not this

        user''s effective access: `user_roles` is identity/SSO-mapping metadata and

        is read by no authorization gate (#3387 / #3522 — see [`assign_role`] for

        the full split between the two role stores). A user can appear here with

        `developer` / `["read","write"]` and still have access to no repository.


        Effective repository access is the union of `role_assignments` and the

        fine-grained `permissions` table; `GET /api/v1/permissions` lists the

        latter.'
      operationId: get_user_roles
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'List of user roles. The `permissions` array describes the ROLE''s capabilities, not this user''s effective
            repository access: roles listed here are identity/SSO-mapping metadata and grant no repository access on their
            own (#3387 / #3522).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      summary: 'Assign role to user (**deprecated**, #3522).'
      description: '**Deprecated: use `POST /api/v1/permissions` instead.** The endpoint keeps

        working and keeps writing `user_roles`, but every successful (200)

        response now carries a `Deprecation` header and a `Link:

        </api/v1/permissions>; rel="successor-version"` header (error responses,

        such as 401/403/422, do not), and the operation is flagged

        `deprecated` in the OpenAPI spec so generated SDKs warn on use. #3522

        chose this (option 1) over scoping the endpoint to a repository or making

        `user_roles` a live global grant.


        **This does not by itself grant access to any repository (#3387 / #3522).**


        There are two role stores and they are not interchangeable. This endpoint

        writes `user_roles`, which is identity metadata: it is listed back by

        `GET /api/v1/users/{id}/roles`, it is what SSO role mapping rebuilds on

        every federated login (`AuthService::apply_role_mapping`), and it is read by

        no authorization gate. Repository authorization resolves

        `role_assignments` (creator auto-grant, `repository-owner`, the rows

        migration 172 wrote) and the fine-grained `permissions` table — never this

        one.


        To give a principal access to repositories, write a fine-grained grant with

        `POST /api/v1/permissions`. That endpoint takes `user`, `service_account`

        and `group` principals against `repository` or `project` targets, and IS

        resolved by every gate (`check_repository_action`, `query_actions`,

        `permissions_grant_exists_for`).


        Wiring `user_roles` into the gates is deliberately NOT done here: the table

        carries no repository scope, so every row is global, and the built-in

        `developer` role carries `read` + `write` — making it live would retroactively

        hand every existing row write access to every repository in the instance,

        and would turn an IdP role claim into a global write grant. That decision is

        tracked in #3522, which settled on deprecating this endpoint instead.'
      operationId: assign_role
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
        required: true
      responses:
        '200':
          description: 'Role assigned successfully. DEPRECATED (#3522): roles assigned here are identity/SSO-mapping metadata
            and do NOT by themselves grant access to any repository — use POST /api/v1/permissions instead. The response carries
            a `Deprecation` header and a `Link` to /api/v1/permissions (rel="successor-version").'
          headers:
            Deprecation:
              schema:
                type: string
              description: RFC 9745 deprecation date, e.g. `@1791244800`
            Link:
              schema:
                type: string
              description: '`</api/v1/permissions>; rel="successor-version"`'
      deprecated: true
      security:
      - bearer_auth: []
  /api/v1/users/{id}/roles/{role_id}:
    delete:
      tags:
      - users
      summary: Revoke role from user
      operationId: revoke_role
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      - name: role_id
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Role revoked successfully
        '404':
          description: Role assignment not found
      security:
      - bearer_auth: []
  /api/v1/users/{id}/tokens:
    get:
      tags:
      - users
      summary: List user's API tokens
      operationId: list_user_tokens
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of API tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenListResponse'
        '403':
          description: Cannot view other users' tokens
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      summary: Create API token
      operationId: create_user_api_token
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserApiTokenRequest'
        required: true
      responses:
        '200':
          description: API token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreatedResponse'
        '403':
          description: Cannot create tokens for other users
      security:
      - bearer_auth: []
  /api/v1/users/{id}/tokens/{token_id}:
    delete:
      tags:
      - users
      summary: Revoke API token
      operationId: revoke_user_api_token
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      - name: token_id
        in: path
        description: API token ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: API token revoked successfully
        '403':
          description: Cannot revoke other users' tokens
      security:
      - bearer_auth: []
  /api/v1/webhooks:
    get:
      tags:
      - webhooks
      summary: List webhooks
      operationId: list_webhooks
      parameters:
      - name: repository_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: enabled
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
    post:
      tags:
      - webhooks
      summary: Create webhook.
      description: 'Generates a fresh signing secret (or accepts a caller-supplied one),

        encrypts it at rest, and returns the raw secret in the response body

        **once**. After this call, GET on the webhook returns only

        `secret_digest`, never the raw secret.'
      operationId: create_webhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
        required: true
      responses:
        '200':
          description: Webhook created. Body includes the raw secret exactly once (omitted when created unsigned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretCreatedResponse'
        '400':
          description: 'Validation error: invalid URL, no events, an event name outside the accepted set (the message lists
            the accepted names), or an unsupported event_schema_version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Validation error, including: a secret was supplied but AK_WEBHOOK_SECRET_KEY is not configured, so
            the secret cannot be encrypted at rest (create the webhook without a secret, or have an administrator configure
            the signing key); or signing_mode asymmetric/both was requested but AK_WEBHOOK_SECRET_KEY is not configured, or
            cannot decrypt the stored instance signing key (it was changed after the key was created)'
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
  /api/v1/webhooks/jwks:
    get:
      tags:
      - webhooks
      summary: Public JWKS for verifying `v2=` webhook signatures (#921).
      description: 'Unauthenticated by design: it carries only public keys, and receivers

        (which hold no Artifact Keeper credentials) must be able to fetch it.

        Each key''s `kid` matches the `<kid>` in `v2=<kid>:<sig>`. A `v2=` token

        signs `"<t>.<webhook_id>.<raw body>"`; receivers must check that the

        delivery''s `X-ArtifactKeeper-Webhook-Id` is their own webhook''s id and

        verify over that id, which stops a delivery captured at one receiver

        being replayed to another (one instance key signs for every webhook). The instance

        key is created on first fetch when `AK_WEBHOOK_SECRET_KEY` is set; when

        it is not, the key set is empty.'
      operationId: get_webhook_jwks
      responses:
        '200':
          description: JSON Web Key Set of the instance webhook signing keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksDocument'
        '500':
          description: Internal server error
  /api/v1/webhooks/{id}:
    get:
      tags:
      - webhooks
      summary: Get webhook by ID
      operationId: get_webhook
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '404':
          description: Webhook not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - webhooks
      summary: Delete webhook
      operationId: delete_webhook
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook deleted successfully
        '404':
          description: Webhook not found
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/deliveries:
    get:
      tags:
      - webhooks
      summary: List webhook deliveries
      operationId: list_deliveries
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: List of webhook deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/deliveries/{delivery_id}/redeliver:
    post:
      tags:
      - webhooks
      summary: Redeliver a failed webhook
      operationId: redeliver
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      - name: delivery_id
        in: path
        description: Delivery ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Redelivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '404':
          description: Webhook or delivery not found
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/disable:
    post:
      tags:
      - webhooks
      summary: Disable webhook
      operationId: disable_webhook
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook disabled successfully
        '404':
          description: Webhook not found
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/enable:
    post:
      tags:
      - webhooks
      summary: Enable webhook
      operationId: enable_webhook
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook enabled successfully
        '404':
          description: Webhook not found
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags:
      - webhooks
      summary: Rotate the signing secret for a webhook.
      description: 'Generates a new raw secret, encrypts it, moves the existing

        `secret_encrypted` into `secret_previous_encrypted`, and stamps an

        expiry 24 hours in the future. GHSA-qcmj: the new raw secret is NOT

        returned in the response body — only success and non-reversible

        metadata (`secret_digest`, previous-secret expiry). The new secret is

        retained encrypted at rest and consumed out-of-band. The HMAC signing

        path (added in a later ticket)

        signs deliveries with both secrets while the previous one is within

        its expiry window so consumers can rotate without dropped events.


        If a previous-secret window is still active when the rotate request

        arrives, the request is REJECTED with HTTP 409 Conflict. This prevents

        two near-simultaneous rotations from clobbering the original

        `secret_previous_encrypted` material before the operator has finished

        distributing the previous new key. The 409 body is structured:

        `{"error": "rotation_already_in_progress", "expires_at": "<RFC3339>"}`.'
      operationId: rotate_webhook_secret
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Secret rotated. Body reports success and metadata only; the raw secret is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateWebhookSecretResponse'
        '404':
          description: Webhook not found
        '409':
          description: A previous rotation overlap window is still active
        '500':
          description: Encryption key not configured
      security:
      - bearer_auth: []
  /api/v1/webhooks/{id}/test:
    post:
      tags:
      - webhooks
      summary: Test webhook by sending a test payload
      operationId: test_webhook
      parameters:
      - name: id
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookResponse'
        '404':
          description: Webhook not found
      security:
      - bearer_auth: []
  /health:
    get:
      tags:
      - health
      summary: Health check endpoint -- rich status page for dashboards.
      description: 'Checks database, storage (real write/read probe), optional services (Trivy,

        OpenSearch, LDAP), and exposes DB connection pool statistics.


        Every dependency sub-check is served through [`cached_check`], so repeated

        polling of this unauthenticated endpoint cannot drive one probe per request

        (#3127). The database check is left uncached deliberately: it is a single

        `SELECT 1` against an already-established pool connection, which is the

        cheapest thing on the page and the one signal that most needs to be live.'
      operationId: health_check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /livez:
    get:
      tags:
      - health
      summary: Liveness probe - confirms the process is alive and can serve HTTP.
      description: 'Takes no State parameter. If Axum can route the request and execute this

        function, the process is alive. External service failures cannot trigger

        pod restarts.'
      operationId: liveness_check
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'
  /pypi/{repo_key}/pypi:
    post:
      tags:
      - pypi
      summary: PyPI XML-RPC endpoint (`browse`, `list_packages`).
      operationId: xmlrpc
      parameters:
      - name: repo_key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        description: 'XML-RPC `methodCall` (opaque). Supported methods: `browse([classifier, ...])` and `list_packages()`.'
        content:
          text/xml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: 'XML-RPC `methodResponse` (opaque). `browse` answers `[[name, version], ...]` from stored metadata
            (hosted repositories, and the hosted members of a virtual); an unknown method, a malformed request, or either
            method on a remote repository or a virtual without hosted members (fault -32001: the call is never forwarded upstream;
            JupyterLab surfaces it as a generic error, the reason is in the response) answers an XML-RPC fault, not an HTTP
            error.'
          content:
            text/xml:
              schema:
                type: string
        '404':
          description: Repository not found
        '413':
          description: Request body larger than 64 KiB
  /pypi/{repo_key}/pypi/{project}/json:
    get:
      tags:
      - pypi
      summary: Legacy PyPI JSON API, project form.
      operationId: legacy_project_json
      parameters:
      - name: repo_key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name; normalized per PEP 503 for the lookup
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Legacy PyPI JSON document: `info` for the latest release, `releases` keyed by version, `urls` for
            the latest release. Download URLs point at this repository.'
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Project blocked by a curation rule
        '404':
          description: Repository or project not found
  /pypi/{repo_key}/pypi/{project}/{version}/json:
    get:
      tags:
      - pypi
      summary: Legacy PyPI JSON API, release form.
      operationId: legacy_release_json
      parameters:
      - name: repo_key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name; normalized per PEP 503 for the lookup
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: Release version (PEP 440; `1.0` matches a stored `1.0.0`)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Legacy PyPI JSON document for one release: `info` and `urls`. Download URLs point at this repository.'
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Project or version blocked by a curation rule
        '404':
          description: Repository, project or release not found
  /readyz:
    get:
      tags:
      - health
      summary: Readiness probe - is the service ready to accept traffic?
      description: 'Ready means "can serve artifacts": 200 once the database is reachable and

        migrations have applied successfully. OpenSearch, storage, the scanner and

        LDAP are probed too (concurrently, cached, at most

        [`READYZ_DEPENDENCY_TIMEOUT`] each) and reported under `dependencies`, but

        do not gate readiness: artifact serving works without them. With

        `READYZ_REQUIRE_SEARCH=true` an unhealthy or unconfigured OpenSearch makes

        this a 503 that names it under `failing` (#4610). Initial-setup state (whether the default admin password has

        been changed) is reported as an informational field on the response but

        does NOT influence the status code: a 503 here would make Kubernetes

        restart the pod, terminating any `kubectl exec` session an operator is

        using to complete setup. See issue #889.


        API mutations are separately gated by the setup middleware

        (`api::middleware::setup`) until setup is complete, so a 200 from this

        endpoint does not imply that write traffic will be accepted.'
      operationId: readiness_check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
components:
  schemas:
    AccessibleUser:
      type: object
      description: One principal that can read an affected artifact but has not downloaded it.
      required:
      - user_id
      - username
      - reason
      - via
      properties:
        reason:
          type: string
          description: Always `has-access` for this endpoint (accessible minus downloaded).
        user_id:
          type: string
          format: uuid
        username:
          type: string
        via:
          type: string
          description: 'How access is granted: `admin` (global), `permission` (fine-grained

            direct **or** group grant, repo or owning project), or `role`

            (role_assignment only). Direct and group grants both surface as

            `permission` because they share one read fragment.'
    AccessibleUsersResponse:
      type: object
      description: 'Full accessible-but-not-downloaded report for a CVE or artifact, scoped to

        one restricted repository.'
      required:
      - target
      - repository
      - exposure
      - accessible_not_downloaded
      - page
      - per_page
      properties:
        accessible_not_downloaded:
          type: array
          items:
            $ref: '#/components/schemas/AccessibleUser'
          description: 'The page of accessible-but-not-downloaded principals. Empty when

            `exposure != "enumerable"`.'
        exposure:
          type: string
          description: '`enumerable` | `everyone` | `effectively-everyone`.'
        page:
          type: integer
          format: int32
          minimum: 0
        per_page:
          type: integer
          format: int32
          minimum: 0
        repository:
          $ref: '#/components/schemas/RepoExposure'
        target:
          $ref: '#/components/schemas/BlastRadiusTargetInfo'
        total:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Total accessible-not-downloaded principals (the pagination total).

            `null` for `public` repos (never enumerated).'
    AcknowledgeRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    ActiveBannersResponse:
      type: object
      required:
      - banners
      properties:
        banners:
          type: array
          items:
            $ref: '#/components/schemas/PublicBanner'
          description: Active banners, most severe first.
    AddArtifactLabelRequest:
      type: object
      properties:
        value:
          type: string
    AddBuildArtifactsRequest:
      type: object
      required:
      - artifacts
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifactInputPayload'
    AddBuildArtifactsResponse:
      type: object
      required:
      - artifacts
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/BuildArtifactResponse'
    AddLabelRequest:
      type: object
      properties:
        value:
          type: string
    AddPeerLabelRequest:
      type: object
      properties:
        value:
          type: string
    AddProjectMemberRequest:
      type: object
      required:
      - principal_type
      - principal_id
      - actions
      properties:
        actions:
          type: array
          items:
            type: string
          description: 'Actions granted on every repository in the project (e.g. ["read"],

            ["read", "write"]).'
        principal_id:
          type: string
          format: uuid
        principal_type:
          type: string
          description: '"user", "service_account" or "group".'
    AddVirtualMemberRequest:
      type: object
      required:
      - member_key
      properties:
        member_key:
          type: string
        priority:
          type:
          - integer
          - 'null'
          format: int32
    AdminBanner:
      allOf:
      - $ref: '#/components/schemas/Banner'
      - type: object
        required:
        - active
        properties:
          active:
            type: boolean
            description: Enabled and inside its display window at the time of the request.
      description: 'An admin''s view of a banner: everything stored, plus whether it is

        displayed right now.'
    AdminUserResponse:
      type: object
      required:
      - id
      - username
      - email
      - auth_provider
      - is_active
      - is_admin
      - is_service_account
      - must_change_password
      - created_at
      properties:
        auth_provider:
          type: string
        created_at:
          type: string
          format: date-time
        display_name:
          type:
          - string
          - 'null'
        email:
          type: string
        id:
          type: string
          format: uuid
        is_active:
          type: boolean
        is_admin:
          type: boolean
        is_service_account:
          type: boolean
          description: 'Whether this row is a service account rather than a person (#3634).


            `list_users` already read this column; it was dropped here, leaving

            clients no way to tell the two kinds of principal apart.'
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        must_change_password:
          type: boolean
        username:
          type: string
    AdvancedSearchResponse:
      type: object
      required:
      - items
      - pagination
      - facets
      properties:
        facets:
          $ref: '#/components/schemas/FacetsResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    AdvisoryResponse:
      type: object
      description: 'One advisory against one vendored component.


        `id` is required, not optional: the web client fails the parse of the whole

        artifact on an entry without one rather than dropping it silently. That is

        the right trade -- a list that quietly lost a row renders as a shorter,

        cleaner list, and this endpoint exists to stop things looking cleaner than

        they are.'
      required:
      - id
      - severity
      properties:
        id:
          type: string
          description: '`CVE-2023-4863`, a `GHSA-` id, or the feed''s own identifier.'
        severity:
          type: string
          description: '`critical` / `high` / `medium` / `low` / `info`. An open union: a client

            that does not recognise a value renders it neutrally rather than

            dropping the advisory.'
        summary:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    AdvisoryScanResponse:
      type: object
      description: The advisory-feed status behind a component list.
      required:
      - status
      properties:
        reason:
          type:
          - string
          - 'null'
          description: 'Why, as a sentence rendered to the user verbatim. Non-null exactly when

            `status` is not `ok`, mirroring the CHECK that governs

            `completeness.reason`.'
        status:
          type: string
          description: '`ok`, `not_run` or `partial`. An open union: a client that does not

            recognise a value must narrow to "unknown", asserting neither that the

            feed answered nor that it failed.


            * `ok` — feeds answered, so a component''s `[]` is a real clean result.

            * `not_run` — no dependency scan has completed for this artifact.

            * `partial` — a feed was asked and did not answer.'
    AffectedRepo:
      type: object
      description: One repository containing an affected artifact, with its access exposure.
      required:
      - repository_id
      - repository_key
      - is_public
      - access_scope
      properties:
        access_scope:
          type: string
          description: '`public` | `internal` | `restricted_acl` | `restricted_roles` — see

            [`classify_access_scope`].'
        is_public:
          type: boolean
          description: 'Deprecated mirror of `access_scope == "public"`; kept so existing

            admin dashboards keep rendering. Read `access_scope` instead: it is the

            field that distinguishes `internal` from the restricted states.'
        repository_id:
          type: string
          format: uuid
        repository_key:
          type: string
    AgeGateConfigResponse:
      type: object
      required:
      - repository_key
      - enabled
      - min_age_days
      - mode
      properties:
        enabled:
          type: boolean
        min_age_days:
          type: integer
          format: int32
        mode:
          type: string
          description: 'Age-source mode: `upstream_publish_time` or `first_seen` (#2264).'
