          type: integer
          format: int64
    WebhookResponse:
      type: object
      required:
      - id
      - name
      - url
      - events
      - is_enabled
      - payload_template
      - event_schema_version
      - signing_mode
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        event_schema_version:
          type: string
          description: 'Pinned event payload version (e.g. "2026-04-01"). Determines the

            shape of the rendered payload and the value sent in the

            `X-ArtifactKeeper-Event-Version` header.'
        events:
          type: array
          items:
            type: string
        headers:
          type:
          - object
          - 'null'
        id:
          type: string
          format: uuid
        is_enabled:
          type: boolean
        last_triggered_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        payload_template:
          $ref: '#/components/schemas/PayloadTemplate'
        repository_id:
          type:
          - string
          - 'null'
          format: uuid
        secret_digest:
          type:
          - string
          - 'null'
          description: 'Short non-reversible identifier for the current signing secret

            (`whsec_...abcd`), suitable for display in operator UIs. The raw

            secret is never returned by GET or LIST.'
        secret_rotation_active:
          type: boolean
          description: 'True while a previous secret is still accepted by the retry path

            during a rotation overlap window.'
        signing_mode:
          $ref: '#/components/schemas/SigningMode'
          description: Which signature tokens deliveries carry (`hmac`, `asymmetric`, `both`).
        url:
          type: string
    WebhookSecretCreatedResponse:
      allOf:
      - $ref: '#/components/schemas/WebhookResponse'
      - type: object
        properties:
          secret:
            type:
            - string
            - 'null'
            description: 'Raw signing secret. Display this to the operator immediately and

              instruct them to record it; the server retains only the encrypted

              form and a short digest.


              Absent when the webhook was created without a signing secret. This

              happens when no secret was supplied and the deployment has no

              `AK_WEBHOOK_SECRET_KEY` configured: rather than fail the create with

              a 500, the webhook is stored unsigned and deliveries omit the

              signature header. Configure the key and rotate the secret later to

              enable signing.'
      description: 'Response returned exactly once when a webhook is created or its secret

        is rotated. The raw `secret` value is not retrievable afterwards.'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
      description: Format (package-manager) endpoints only. Accepts a `username:password` login, or an API token in the password
        field (any username) for `pip` netrc / Artifactory-style clients. Not accepted as a token carrier on `/api/v1/*`.
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Canonical scheme for `/api/v1/*`. Send an API token or a login-issued JWT as `Authorization: Bearer <token>`.'
