          description: Why analysis was skipped. Non-null exactly when `findings` is null.
        content_available:
          type: boolean
          description: 'False when the script was detected but its bytes could not be read.


            The UI renders this as "contents could not be read" rather than "no

            findings" — an unread script is not a safe one.'
