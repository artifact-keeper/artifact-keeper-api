  /api/v1/sbom/cve/history/{id}:
    get:
      tags:
      - sbom
      summary: Get CVE history by artifact UUID or CVE identifier (legacy overload).
      description: "The path param accepts either:\n  - A UUID `artifact_id` (legacy shape, returns all CVEs for one artifact)\n\
        \  - A CVE id like `CVE-2019-10744` (returns this CVE across every artifact\n    the caller can access)\n\n# URL design\
        \ decision (#1385 round-2)\n\nOverloading a single `{id}` path parameter to mean two different lookups\nis a REST\
        \ anti-pattern: the route's behavior changes based on a runtime\ncontent sniff. We considered splitting into two routes\
        \ vs documenting the\noverload and chose **both**: the split routes\n`GET /cve/history/by-artifact/{uuid}` and `GET\
        \ /cve/history/by-cve/{cve_id}`\nare the canonical shape for new clients (typed path params, no sniff),\nwhile this\
        \ overload remains so the v1.2.0 SDKs that already shipped\nagainst the single-route shape keep working. New code\
        \ should prefer the\nsplit routes; the overload may be deprecated in v1.3.\n\nIssue #1375: prior to this fix the route\
        \ was typed `Path<Uuid>`, so any\nCVE-id call (e.g. the release-gate `GET /sbom/cve/history/CVE-2019-10744`)\nfailed\
        \ Axum's path extractor with a bare HTTP 400, leaving consumers\nunable to look up history by CVE."
      operationId: get_cve_history
      parameters:
      - name: id
        in: path
        description: Artifact UUID or CVE identifier (e.g. CVE-2019-10744). Prefer the typed routes /cve/history/by-artifact/{uuid}
          or /cve/history/by-cve/{cve_id}.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CVE history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CveHistoryEntry'
        '400':
          description: Path id is neither a valid UUID nor a valid CVE identifier
      security:
      - bearer_auth: []
  /api/v1/sbom/cve/status/by-artifact/{artifact_id}/by-cve/{cve_id}:
    post:
      tags:
      - sbom
      summary: Update CVE status for a synth (scan_findings-derived) Security tab row.
      description: 'Background (#1426): the Security tab read path projects `scan_findings`

        into `CveHistoryEntry` rows whose `id` is a deterministic SHA-256 hash

        (see `synth_cve_id`). Those ids have no corresponding row in the

        `cve_history` table, so calls to `POST /cve/status/{id}` always 404 -- a

        dead acknowledge path. This route operates on the only stable identity a

        synth row carries, the (artifact_id, cve_id) pair, and writes the

        underlying `scan_findings` rows instead.


        The wider design choice between (A) populating `cve_history` from the

        scanner loop and (B) treating `scan_findings` as the source of truth for

        the Security tab is settled here in favour of B: less code, less risk of

        data drift between two parallel tables, and `cve_history` remains in

        place for the rare curated/admin write path via the legacy

        `POST /cve/status/{id}` route.'
      operationId: update_cve_status_by_artifact_cve
      parameters:
      - name: artifact_id
        in: path
        description: Artifact UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: cve_id
        in: path
        description: CVE identifier (e.g. CVE-2019-10744)
