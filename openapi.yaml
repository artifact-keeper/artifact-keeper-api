  /api/v1/signing/artifacts/{artifact_id}/sign:
    post:
      tags:
      - signing
      summary: '`POST /api/v1/signing/artifacts/{artifact_id}/sign` — produce an authorized

        signature over the artifact''s content with the repository''s active signing

        key and record the attestation the promotion `require_signature` gate reads

        (#2535).'
      description: 'This is the ONLY writer of the per-artifact `used_for_signing` marker, and

        it is admin-gated: an artifact can satisfy `require_signature` only through a

        deliberate, authenticated signing action over its bytes — never as a side

        effect of an (anonymous) repository-metadata read. Format-agnostic: signs

        content bytes, so it works for every hosted format, not just the

        metadata-signing ones. Proxy-cached remote artifacts (no `artifacts` row)

        cannot be signed and therefore stay fail-closed under `require_signature`.'
      operationId: sign_artifact
      parameters:
      - name: artifact_id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artifact signed; attestation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignArtifactResponse'
        '403':
          description: Admin privilege required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Artifact not found or not eligible for signing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Repository has no active signing key/config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
