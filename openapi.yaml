  /api/v1/repositories/{key}/upstream-filter:
    get:
      tags:
      - repositories
      summary: Get the upstream filter of a remote repository
      operationId: get_upstream_filter
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current upstream filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFilterResponse'
        '400':
          description: Repository is not a remote repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
    put:
      tags:
      - repositories
      summary: Set the upstream filter of a remote repository
      description: "Restricts which paths this remote repository requests from its upstream.\nPatterns are regular expressions\
        \ (Rust `regex` syntax) matched anywhere in\nthe subject; anchor them with `^`/`$`. If `include_patterns` is non-empty\
        \ a\npath must match one of them; a path matching any `exclude_patterns` entry\nis refused. A refused path answers\
        \ 404 without contacting the upstream, and\na virtual repository skips this member for it.\n\nThe subject is the path\
        \ as it is sent upstream, relative to the upstream\nURL and without a leading `/`, query string included:\n- Maven,\
        \ Debian, OCI (`v2/<name>/manifests/<ref>`), Go and similar: the\n  repository layout path, e.g. `com/acme/lib/1.0/lib-1.0.jar`.\n\
        - npm: package metadata uses the wire form `@scope%2Fname`, tarballs\n  `@scope/name/-/name-1.0.0.tgz`, so a scope\
        \ rule should match both\n  (`^@acme(/|%2F)`).\n- Formats that download from another host (PyPI files on\n  `files.pythonhosted.org`,\
        \ cargo `dl` hosts, NuGet service URLs): the full\n  absolute URL, unless it lies under the upstream URL.\n\nNot filtered\
        \ in this version: npm `/-/` passthroughs (search, attestations,\nping) and npm audit, curation upstream sync, change\
        \ feeds, and the admin\n`test-upstream` probe.\n\nA proxy-cache entry for a refused path is served only while it is\
        \ fresh:\nonce it expires it is neither revalidated nor served stale, and answers 404\nlike a miss (purge it with\
        \ `cache/invalidate` to hide it immediately).\nLimits: 64 patterns per list, 512 bytes each, each list compiled to\
        \ at most\n64 KiB; subjects longer than 4 KiB are refused. Submitting two empty lists\nremoves the filter. Changes\
        \ apply at once on every replica (a missed\nnotification converges within 30 s)."
      operationId: set_upstream_filter
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamFilter'
        required: true
      responses:
        '200':
          description: Upstream filter saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFilterResponse'
        '400':
          description: Invalid pattern, too many patterns, or not a remote repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - repositories
      summary: Remove the upstream filter of a remote repository
      operationId: delete_upstream_filter
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Upstream filter removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFilterResponse'
        '400':
          description: Repository is not a remote repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
