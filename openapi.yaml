      - repositories
      summary: Get deduplicated storage accounting for a repository (#2056).
      description: 'Returns the true physical footprint (with dedup savings) from the

        materialized stats cache. Same visibility rules as `get_repository`:

        public repos and repo members pass; everyone else gets an existence-hiding

        404.


        The whole-instance aggregate `instance_unique_bytes` is admin-only and is

        omitted for non-admin/anonymous callers; they receive only this

        repository''s own figures.


        On cloud (instance-scope) backends the dedup breakdown (`physical_bytes`,

        `unique_bytes`, `shared_bytes`, `dedup_ratio`) is cross-tenant-derivable and

        is likewise restricted to admins (#2560); non-admins/anon see only their

        repository''s `logical_bytes`, `blob_count`, `dedup_scope` and `computed_at`.'
      operationId: get_repository_storage
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deduplicated storage stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryStorageStatsResponse'
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
  /api/v1/repositories/{key}/storage-gc:
    post:
      tags:
      - repositories
      summary: POST /api/v1/repositories/{key}/storage-gc
      description: 'Repository-scoped storage garbage collection (web #708): the endpoint the

        web UI''s per-repo storage panel calls with `{dry_run: true}` for its

        "reclaimable now" estimate.


        Semantics: every candidate sweep of [`StorageGcService::run_gc`] is

        restricted to rows owned by this repository (soft-deleted artifacts,

        abandoned OCI upload sessions, orphaned upload cleanup keys, and orphaned

        Maven flat-object attribution rows), while the orphan *predicates* stay

        instance-wide — a storage key is only reclaimed (or counted, on a dry

        run) when no live artifact, tag, blob, or manifest reference exists for

        it anywhere on the instance. The dry-run estimate is therefore

        dedup-aware: bytes still shared with another repository are never

        reported as reclaimable. On shared (cloud) backends a live run

        hard-deletes every repository''s soft-deleted rows for a reclaimed key,

        exactly as the instance-wide pass would. Admin-gated like the

        instance-wide endpoint.'
      operationId: run_repository_storage_gc
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageGcRequest'
        required: true
      responses:
        '200':
          description: GC result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageGcResult'
        '401':
          description: Authentication required, or admin privileges required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
