  /api/v1/environments/advisory-transitions:
    get:
      tags:
      - environments
      summary: 'Affectedness transitions across every stored environment the caller may

        read (#4055) — the event surface of environment re-evaluation.'
      description: 'Only TRANSITIONS are listed: an environment becoming affected by a newly

        published advisory (`new-affected`) or ceasing to be affected

        (`no-longer-affected` — withdrawal, or a fixed version shifting past the

        stored one). Steady state is not an event and is not here. Visibility is

        rendered by the same `require_visible` predicate the repository listing

        uses, so a caller never learns that an environment in a repository they

        cannot read transitioned.'
      operationId: list_advisory_transitions
      parameters:
      - name: advisory
        in: query
        description: Restrict to one advisory id (e.g. `GHSA-j8r2-6p8f-2345`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: kind
        in: query
        description: 'Restrict to one transition kind: `new-affected` or

          `no-longer-affected`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: since
        in: query
        description: Only transitions detected at or after this RFC 3339 timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: until
        in: query
        description: Only transitions detected at or before this RFC 3339 timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: limit
        in: query
        description: Page size (1-500, default 100).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Affectedness transitions, newest first
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unknown transition kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/environments/lookup:
    get:
      tags:
      - environments
      summary: 'The reverse index: which stored environments contain a component (#4054).'
      description: 'Given a component purl — typically straight out of an advisory — returns

        every stored environment containing it, per (environment, platform)

        scope, with the inclusion chains from a root down to the component. The

        answer is restricted to repositories the caller may read, rendered by the

        same visibility rule `require_visible` applies row by row. The membership

        predicate is an index scan over the purl base, so the query holds at

        realistic environment counts.'
      operationId: lookup_environments
      parameters:
      - name: purl
        in: query
        description: 'Component purl, e.g. from an advisory (`pkg:pypi/requests@2.31.0`).

          Qualifiers are stripped before lookup: advisories are

          name/version-scoped, so the index is keyed on the purl base.'
        required: true
        schema:
          type: string
      - name: max_paths
        in: query
        description: Maximum inclusion paths returned per hit (1-64, default 8).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: Affected environments per platform, with inclusion paths
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing or empty purl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
