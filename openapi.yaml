    VendoredComponentResponse:
      type: object
      description: A native library compiled into the package, as declared by its recipe.
      required:
      - name
      - confidence
      - applied_patches
      - cpe_candidates
      - cpe_ambiguous
      properties:
        abi_version:
          type:
          - string
          - 'null'
          description: 'The ELF/libtool ABI version, kept DELIBERATELY SEPARATE from `version`.


            These are different numbering schemes and conflating them is actively

            dangerous: `libwebp.so.7` ships in libwebp 1.2.4. Reported so a reviewer

            can see what the binary says about itself, and never substituted for

            `version` -- a CVE matcher handed 7 in place of 1.2.4 matches

            confidently and wrongly.'
        advisories:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdvisoryResponse'
          description: "Known advisories against this component, or `null` when nothing has\nasked.\n\n`null` and `[]` are\
            \ different facts and clients must not conflate them,\nexactly as with `InstallScriptResponse::findings`. `[]`\
            \ means an\nadvisory feed was queried and knows of nothing; `null` means the\nquestion was never put, or was put\
            \ and not answered. There are three\nways to get `null`, and all three must render as \"not a clean result\":\n\
            \n1. No version was recovered for the component, so it is deliberately\n   never sent to a feed -- a version-less\
            \ query matches every advisory\n   ever filed against the name.\n2. No dependency scan has completed for this\
            \ artifact. Absence of\n   findings before anything ran is absence of a QUESTION, not an\n   answer, and without\
            \ this every freshly uploaded artifact would\n   render as clean.\n3. The scan that ran was `partial` -- an advisory\
            \ feed did not answer.\n   Its silence is not an all-clear."
        applied_patches:
          description: '`[{name, description?, source_url?}]`. Carried so a backported fix is

            not reported as the unpatched upstream version.'
        confidence:
          type: string
          description: '`declared`, `inferred` or `unresolved`.


            An `unresolved` row means a template expression in the recipe could not

            be evaluated, so the version is unknown. It is still reported: "a source

            exists and we could not pin it" is materially different from "this

            package vendors nothing", and only one of those is good news.'
        cpe_ambiguous:
          type: boolean
          description: 'True when the top-confidence tier of `cpe_candidates` holds more

            than one candidate.


            Surfaced, not resolved: nothing in the pipeline picks one of several

            equally-ranked guesses, so the Dependency-Track submission omits

            `cpe` for such a component rather than writing an arbitrary one. A

            reviewer seeing `true` here must disambiguate against upstream

            themselves.'
        cpe_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CpeCandidateResponse'
          description: 'Candidate CPEs under which this component may appear in NVD (#4043).


            NVD is CPE-keyed, so without these the component is discovered and

            then matched against nothing. The list is ALL candidates the mapping

            rules produced, best-first -- never a collapsed single guess, because

            vendor/product ambiguity is endemic in CPE (several vendors publish

            the same product name). Each candidate carries the `rule_id` of the

            mapping rule that produced it, so a wrong candidate is traceable to

            its rule, and a `confidence` (`high` for a curated table hit,

            `medium` for a source-URL-derived vendor, `low` for a name-only

            guess). An empty list means no rule had enough evidence -- a name

            too short or malformed to guess from produces no candidate rather

            than an invented one.'
        detection_method:
          type:
          - string
          - 'null'
        git_rev:
          type:
          - string
          - 'null'
        git_url:
          type:
          - string
          - 'null'
        name:
          type: string
        purl:
          type:
          - string
          - 'null'
        sha256:
          type:
          - string
          - 'null'
        soname:
          type:
          - string
          - 'null'
          description: 'The library''s own linker name, where the packaging tool preserved it

            (`libwebp.so.7.1.3`). For a wheel this is the most useful single string

            to show a reviewer, because the file on disk has been renamed.'
        source_url:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
    VersionResponse:
      type: object
      required:
      - repository
      - version_number
      - package_count
      - published
      properties:
        package_count:
          type: integer
          format: int64
          description: The number of approved packages frozen into the snapshot.
        published:
