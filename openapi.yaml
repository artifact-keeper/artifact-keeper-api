          description: 'Allowed npm full-name glob patterns (#2424), read back from

            `repository_config`. Omitted for non-npm repositories or when unset.'
        npm_allowed_scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Allowed npm `@scope` literals (#2424), read back from

            `repository_config`. Omitted for non-npm repositories or when unset.'
        npm_virtual_isolate_hosted_names:
          type:
          - boolean
          - 'null'
          description: 'npm Virtual isolate mode (#3767): the effective value for npm Virtual

            repositories; omitted for every other repository.'
        oci_trusted_bearer_realms:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Cross-origin OCI Bearer token realms trusted to receive this Remote

            repository''s upstream credentials (#3591), canonical origins. Omitted

            when none are configured (the strict same-origin default applies).'
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Project this repository is assigned to (#2472), if any.
        promotion_only:
          type: boolean
          description: When true, direct user uploads are rejected; artifacts must be promoted.
        quarantine_duration_minutes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Configured quarantine hold duration in minutes, read back from

            `repository_config` (#1770 B). `None` when unset.'
        quarantine_enabled:
          type:
          - boolean
          - 'null'
          description: 'Whether the Package Age / quarantine policy is enabled for this

            repository, read back from `repository_config` (#1770 B). `None` when

            the repository has no explicit setting (the global default applies).'
        quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
        repo_type:
          type: string
        repodata_depth:
          type: integer
          format: int32
          description: Always present; 0 preserves the legacy repository-root metadata layout.
          maximum: 1023
          minimum: 0
        repodata_depth_editable:
          type: boolean
          description: Structural eligibility and emptiness only, not an authorization grant.
        storage_backend:
          type: string
          description: 'Which storage backend holds this repository''s content: `filesystem`,

            `s3`, `azure`, `gcs`. Accepted on create and immutable afterwards, so

            before #3917 it was write-only — no read path echoed it back and

            `RepositoryResponse` had no such field, leaving an operator with no API

            answer to "where does this repository actually store bytes?" for a

            value they can never change again. Stored on the repositories row

            (`NOT NULL DEFAULT ''filesystem''`), so like `curation_enabled` this

            needs no separate lookup and is always concrete.'
        storage_used_bytes:
          type: integer
          format: int64
          description: 'Bytes stored in this repository itself. Always 0 for a virtual

            repository, which stores nothing of its own, so summing this field

            over repositories (for example per project) counts each byte once

            (#4423).'
        updated_at:
          type: string
          format: date-time
        upstream_auth_configured:
          type: boolean
        upstream_auth_type:
          type:
          - string
          - 'null'
        upstream_url:
          type:
          - string
          - 'null'
          description: 'The Remote repository''s upstream URL with any embedded userinfo

            (`user:password@` or `token@`) removed (#4452). Credentials embedded in

            the URL at create time are still stored and still sent upstream as

            HTTP Basic auth, but are never returned; `upstream_url_has_credentials`

            says whether any are configured.'
        upstream_url_has_credentials:
          type: boolean
          description: 'Whether the stored `upstream_url` carries embedded userinfo

            credentials that were stripped from `upstream_url` above (#4452).

            Independent of `upstream_auth_configured`, which covers the dedicated

            (encrypted) upstream credential fields.'
        versioning_enabled:
          type: boolean
          description: 'When true, uploads to this Generic/Mlmodel repository append immutable

            revisions instead of overwriting the prior content (#2367).'
        visibility:
          $ref: '#/components/schemas/RepositoryVisibility'
          description: 'Baseline read audience: `public`, `internal`, or `private`. This is the

            authoritative field; read it rather than `is_public`, which cannot

            distinguish `internal` from `private`.'
