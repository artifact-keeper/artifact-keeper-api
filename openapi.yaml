              Omitted for non-Debian-remote repositories or when no filter is set.'
        description:
          type:
          - string
          - 'null'
        format:
          type: string
        format_key:
          type:
          - string
          - 'null'
          description: 'Plugin format key for a WASM-plugin-backed repository (#3070). Such a

            repository is stored as `format = "generic"` plus this key, so it is the

            only way to tell it apart from a plain generic one. Omitted when the

            repository uses the built-in handler for `format`.'
        has_trusted_gpg_key:
          type: boolean
          description: 'Whether a trusted upstream OpenPGP public key is configured for RPM

            curation signature verification (#2568). The key material itself is

            never returned; this boolean is the only exposure. `false` for repos

            with no key set. Populated by the single-repo handlers (create / get /

            update) and the listing; `repo_to_response` alone defaults it to `false`

            (it is db-less and cannot read the column).'
        id:
          type: string
          format: uuid
        is_public:
          type: boolean
          description: 'DEPRECATED. Always equal to `visibility == "public"`. An `internal`

            repository reads as `false` here, which is correct -- it is not

            anonymously readable -- but indistinguishable from `private`.'
          deprecated: true
        key:
          type: string
        member_storage_used_bytes:
          type:
          - integer
          - 'null'
