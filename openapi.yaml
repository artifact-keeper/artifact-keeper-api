    ProxyBlastRadius:
      type: object
      description: 'Exposure through proxy-cached content, reported alongside the hosted

        numbers (#3397).


        `summary` above is computed over `scan_findings` joined to `artifacts` and

        `download_statistics` — all three artifact-keyed. Proxy-cached bytes have no

        `artifacts` row by design, and their downloads land in

        `proxy_download_statistics` keyed by `proxy_cache_id`, so the hosted numbers

        were not merely incomplete for proxy content: they were structurally

        incapable of being non-zero for it. A confident zero to a security question

        is worse than an error, so this block exists even when it is all zeros — an

        operator can then see that proxy content WAS searched.


        Attribution runs through `proxy_scan_findings` (#3395). Before that table

        existed there was no per-CVE detail for proxy content to attribute a

        download to, which is why #3397 depended on #3395.'
      required:
      - coverage
      - affected_digest_count
      - affected_repo_count
      - download_count
      - downloader_user_count
      - anonymous_download_present
      properties:
        affected_digest_count:
          type: integer
          format: int64
          description: Distinct proxy-cached digests carrying this CVE.
        affected_repo_count:
          type: integer
          format: int64
          description: Repositories whose proxy cache holds one of those digests.
        anonymous_download_present:
          type: boolean
          description: Whether any such pull was anonymous.
        coverage:
          type: string
          description: '`included` | `not_applicable` — see the constants. Never omit this:

            it is what tells a reader whether a zero below means "searched, nothing

            found" or "not searched".'
        download_count:
          type: integer
          format: int64
          description: Proxy download events of affected digests in the window.
        downloader_user_count:
          type: integer
          format: int64
          description: Distinct authenticated users who pulled one.
    ProxyFinding:
      type: object
      description: 'A CVE-identified finding retained from an inline proxy scan so it can be

        persisted into `proxy_scan_findings` and answered back to an operator

        asking "which CVE blocked my build?" (#3395).


        Deliberately narrower than [`RawFinding`]: only the columns the digest-keyed

        table stores. `description`, `source` and `source_url` are dropped because

        they are scanner prose that would bloat a row written on every proxied

        download, and because none of them identify the vulnerability.


        `cve_id` is non-optional here while it is optional on [`RawFinding`]: a

        finding a scanner could not attach a CVE id to has nothing to look up, and

        the table''s identity key is the CVE. Such findings are dropped on the way

        in — they still count toward `findings_count` on the verdict, which is

        computed from the raw list before this projection runs.'
      required:
      - cve_id
      - severity
      properties:
        cve_id:
          type: string
          description: Canonical vulnerability id, e.g. `CVE-2021-44228` or `GHSA-...`.
        fixed_version:
          type:
          - string
          - 'null'
          description: 'Version that resolves it, when the scanner reported one — the single

            most actionable field for an operator whose build was just blocked.'
        package_name:
          type:
          - string
          - 'null'
          description: Component the vulnerability was matched against.
        package_version:
          type:
          - string
          - 'null'
        severity:
          type: string
          description: 'Lowercase severity token (`critical`/`high`/`medium`/`low`/`info`),

            matching the tokens stored on `proxy_scan_results.max_severity`.'
        title:
          type:
          - string
          - 'null'
    ProxyRescanRequest:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: 'Cache path within this repository, e.g.

            `simple/click/click-8.0.0-py3-none-any.whl`. Path-keyed for the same

            cross-tenant reason the read endpoint is.'
    ProxyRescanResponse:
      type: object
      required:
      - repository_key
      - path
      - digest
      - state
      - findings_count
      - critical_count
      - high_count
      - medium_count
      - low_count
      - package_count
      - findings
      properties:
        critical_count:
          type: integer
          format: int32
        digest:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ProxyFinding'
          description: Per-CVE detail from this run, bounded to [`MAX_PROXY_FINDINGS`].
        findings_count:
          type: integer
          format: int32
        high_count:
          type: integer
          format: int32
        low_count:
          type: integer
          format: int32
        max_severity:
          type:
          - string
          - 'null'
        medium_count:
          type: integer
          format: int32
        package_count:
          type: integer
          description: 'Components cataloged and persisted, i.e. how much SBOM this rescan

            produced. Zero means the scanner reported no inventory for these bytes.'
          minimum: 0
        path:
          type: string
        repository_key:
          type: string
        state:
          type: string
          description: '`clean` | `vulnerable` -- the verdict just recorded.'
    ProxyScanEntry:
      type: object
      required:
      - path
      - state
      - cached_at
      - size_bytes
      properties:
        cached_at:
          type: string
          format: date-time
        critical_count:
          type:
          - integer
          - 'null'
          format: int32
        digest:
          type:
          - string
          - 'null'
          description: SHA-256 of the cached bytes; NULL while the row is `pending_ingest`.
        findings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProxyFinding'
          description: 'The CVEs behind the counts (#3395), most severe first and bounded to

            [`MAX_PROXY_FINDINGS`].


            Populated ONLY for a single-path (`?path=`) read, and only for a

            `vulnerable` entry. Two reasons it is absent from the paged listing:

            one query per row would make the list an N+1, and the listing is a

            per-repository overview whose job is to point at the entry to open.


            `None` (omitted) means "not requested at this granularity"; an empty

            vector means "requested, and this digest has no recorded detail" --

            which is the real state for anything cached before #3395 shipped. The

            two must stay distinguishable or a pre-#3395 artifact renders as having

            no CVEs, which reads as clean.'
        findings_count:
          type:
          - integer
          - 'null'
          format: int32
        high_count:
          type:
          - integer
          - 'null'
          format: int32
        low_count:
          type:
          - integer
          - 'null'
          format: int32
        max_severity:
          type:
          - string
          - 'null'
        medium_count:
          type:
          - integer
          - 'null'
          format: int32
        not_scanned_reason:
          type:
          - string
          - 'null'
          description: Set only when `state` is `not_scanned`.
        path:
          type: string
        scanned_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Floored at this repository's own `cached_at` -- see the module note.
        size_bytes:
          type: integer
          format: int64
        state:
          type: string
          description: '`clean` | `vulnerable` | `not_scanned` | `pending_ingest`.'
    ProxyScanSummary:
      type: object
      description: 'Per-state counts over **distinct digests**, not paths: one repository can

        cache the same digest at many paths, and the UI label must say so.'
      required:
      - clean
      - vulnerable
      - not_scanned
      - pending_ingest
      - total_digests
      properties:
        clean:
          type: integer
          format: int64
        not_scanned:
          type: integer
          format: int64
        pending_ingest:
          type: integer
          format: int64
          description: 'Catalog rows whose `checksum_sha256` is still NULL. Counted as PATHS

            (they have no digest to dedupe on) and excluded from every other count.'
        total_digests:
          type: integer
          format: int64
          description: 'Distinct digests cached by this repository. Equals

            `clean + vulnerable + not_scanned`.'
        vulnerable:
          type: integer
          format: int64
    ProxyScanVerdictItem:
