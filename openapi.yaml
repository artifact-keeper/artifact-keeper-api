        description: 'Optional OIDC `prompt` value forwarded to the IdP''s authorization

          endpoint. Only `none` is accepted (silent check-sso): the web UI uses

          it to probe for an existing IdP session without ever rendering the

          IdP''s login page. Any other value is rejected so the login redirect

          cannot be steered into unexpected IdP behaviours.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '307':
          description: Redirect to OIDC authorization endpoint
        '400':
          description: Unsupported prompt value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OIDC provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
