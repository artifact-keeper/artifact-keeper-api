          format: int32
        environment:
          type: string
          description: 'Read-only deployment environment name, sourced from the `ENVIRONMENT`

            config value. Defaulted on deserialization so it is not required in the

            update-settings request body.'
        max_upload_size_bytes:
          type: integer
          format: int64
        retention_days:
          type: integer
          format: int32
        storage_backend:
          type: string
        storage_path:
          type: string
    SystemStats:
      type: object
      required:
      - total_repositories
      - total_artifacts
      - total_storage_bytes
      - total_downloads
      - proxy_download_count
      - total_users
      - active_peers
      - pending_sync_tasks
      - proxy_artifact_count
      - proxy_storage_bytes
      properties:
        active_peers:
          type: integer
          format: int64
        pending_sync_tasks:
          type: integer
          format: int64
        proxy_artifact_count:
          type: integer
          format: int64
          description: 'Count of proxy-cached (pull-through) objects, tracked in

            `proxy_cache_artifacts` rather than `artifacts`. This COUNT is disjoint

            from `total_artifacts`, which reads only the hosted tables.'
        proxy_download_count:
          type: integer
          format: int64
          description: 'Proxy pull-through serves. A **breakdown of** `total_downloads`, not a

            disjoint bucket (the same relation `proxy_storage_bytes` has to

            `total_storage_bytes`): hosted downloads are the difference (#4539).'
        proxy_storage_bytes:
          type: integer
          format: int64
          description: 'Bytes held by proxy-cached objects. Since #3134 this is a **breakdown

            of** `total_storage_bytes`, not a disjoint bucket: the ledger''s

            `proxy_bytes` component is already inside that total, so a dashboard

            that adds the two double-counts the cache (#3650). The count above and

            the bytes here therefore do NOT compose the same way — only the count

            is disjoint.'
        total_artifacts:
          type: integer
          format: int64
          description: 'Rows in `artifacts` (for OCI repositories that is manifests only —

            layer/config blobs are content-addressed objects, not artifacts).

            Unlike the byte total, this count still includes legacy backfilled

            `proxy-cache/%` rows.'
        total_downloads:
          type: integer
          format: int64
          description: 'Every recorded download: hosted artifact downloads

            (`download_statistics`) plus proxy pull-through serves

            (`proxy_download_statistics`). Before #4539 this counted hosted

            downloads only, so an all-proxy deployment reported zero.'
        total_repositories:
          type: integer
          format: int64
        total_storage_bytes:
          type: integer
          format: int64
          description: 'All stored bytes, summed from `repository_usage_ledger`

            (`hosted_bytes + proxy_bytes + oci_bytes`) — the same source the

            per-repository `storage_used_bytes` figures are read from, so the

            dashboard total is consistent with the per-repo column by

            construction (#3134). Includes OCI layer/config blob bytes

            (`oci_blobs`) and proxy-cached bytes; `proxy_storage_bytes` below is

            a *breakdown* of this total, not a disjoint bucket.'
        total_users:
          type: integer
          format: int64
    TelemetrySettings:
