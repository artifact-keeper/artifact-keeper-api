          description: 'Update the allowed npm full-name glob patterns for this npm Remote

            repository (#2424). When provided, replaces the stored

            `npm_allowed_name_patterns` list.'
        npm_allowed_scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Update the allowed npm `@scope` literals for this npm Remote repository

            (#2424). When provided, replaces the stored `npm_allowed_scopes` list.'
        npm_virtual_isolate_hosted_names:
          type:
          - boolean
          - 'null'
          description: 'Turn npm Virtual isolate mode (#3767) on or off. Only valid for npm

            Virtual repositories; omit to leave it unchanged.'
        oci_trusted_bearer_realms:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Replace the trusted cross-origin OCI Bearer token realms for this

            Remote repository (#3591); same rules as on create. Omit to leave the

            list unchanged; send `[]` to clear it and restore the strict

            same-origin default.'
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Assign this repository to a project (#2472). P1 is set-only: omitting

            the field leaves the assignment unchanged (unassignment ships with the

            project-admin surface in P2).'
        promotion_only:
          type:
          - boolean
          - 'null'
          description: 'When provided, enables/disables the `promotion_only` policy for this

            repository (admin-only). When omitted, the flag is left unchanged.'
        pypi_upstream_index_path:
          type:
          - string
          - 'null'
          description: 'Update the PyPI simple-index prefix (stored in `repository_config` under

            `pypi_upstream_index_path`). Pass `""` for flat CDN layout, `"simple"` to

            restore the PEP 503 default, or any other non-empty string for a custom prefix.

            Only meaningful for PyPI / Poetry / Jupyter / Conda Remote repositories.'
        quarantine_duration_minutes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Quarantine hold duration in minutes for this repository.

            Stored in `repository_config` under `quarantine_duration_minutes`.'
        quarantine_enabled:
          type:
          - boolean
          - 'null'
          description: 'Enable or disable quarantine period for this repository.

            When enabled, newly uploaded artifacts are held until scanned.

            Stored in `repository_config` under `quarantine_enabled`.'
        quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
        release_repository_key:
          type:
          - string
          - 'null'
          description: 'Link this staging repository to a release (local) repository.

            Promotions from this staging repo will default to the linked release repo,

            and promotions to any other repo will be rejected.

            Pass an empty string to remove the link.

            Stored in `repository_config` under `release_repository_id`.'
        repodata_depth:
          type: integer
          format: int32
          description: Omit to retain the RPM metadata root depth. Changes require an empty repository.
          maximum: 1023
          minimum: 0
        trusted_gpg_key:
          type:
          - string
          - 'null'
          description: 'Update the trusted upstream OpenPGP public key for RPM curation (#2568).

            Three-way semantics via `Option<Option<String>>`: omit the field to

            leave the stored key unchanged; send `null` to clear it (revert to

            "unverified upstream"); send an ASCII-armored PUBLIC key block to set

            it. A private-key block or malformed armor is rejected (400). The

            response never echoes the key — only `has_trusted_gpg_key`.'
        upstream_url:
          type:
          - string
          - 'null'
          description: 'Replace the repository''s upstream URL (#4467), e.g. to rotate

            credentials embedded as userinfo or to repoint a Remote. Validated

            exactly like `upstream_url` on create (anti-SSRF, scheme/host and the

            per-format checks). The response redacts userinfo and reports

            `upstream_url_has_credentials`. Moving to a different origin

            (scheme, host or port) while upstream-auth credentials are configured

            is refused (409): remove them first, so they are never sent to a host

            they were not configured for. Rotating embedded credentials keeps the

            age gate''s first-seen times and approvals; a host or path change starts

            them afresh. Omit to leave the URL unchanged.'
        versioning_enabled:
          type:
          - boolean
          - 'null'
          description: 'When provided, enables/disables first-class artifact versioning for

            this Generic/Mlmodel repository (#2367). When omitted, unchanged.'
        virtual_metadata_partial:
          type:
          - boolean
          - 'null'
          description: 'Virtual repositories only: when a member''s metadata cannot be fetched

            or parsed, serve the merge of the members that succeeded (marked with

            `X-AK-Partial-Members` and `Cache-Control: no-store`) instead of

            failing with 502. Defaults to `false` (strict). Honoured by every

            virtual metadata merge: conda channels and the merged indexes of Helm,

            CRAN, Hex and Bazel virtuals (#4192). Stored in `repository_config`

            under `virtual_metadata_partial`.'
        visibility:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RepositoryVisibility'
            description: 'Baseline read audience: `public`, `internal`, or `private`.


              This is the authoritative field. `is_public` and its alias

              `allow_anonymous_access` remain accepted for compatibility and mean

              exactly `visibility == "public"`; a client sending only the boolean

              cannot express `internal`. Supplying both is accepted only when they

              agree -- a contradiction is a 400 rather than one silently winning.'
