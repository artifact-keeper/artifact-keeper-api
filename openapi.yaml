  /api/v1/admin/audit:
    get:
      tags:
      - admin
      summary: Query the audit log (admin only).
      description: 'Returns recorded audit events ordered newest-first, filtered by any

        combination of actor/user, action, resource type/id, and time range, with

        page/per_page pagination. Backed by the `audit_log` table and

        [`AuditService::query`]; admin-only both via the `/admin` `admin_middleware`

        and a defense-in-depth check here (#2366).'
      operationId: list_audit_logs
      parameters:
      - name: user_id
        in: query
        description: Filter by acting/subject user id.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: action
        in: query
        description: Filter by action string (e.g. `LOGIN`, `USER_CREATED`, `ARTIFACT_DOWNLOADED`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: resource_type
        in: query
        description: Filter by resource type (e.g. `user`, `repository`, `artifact`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: resource_id
        in: query
        description: Filter by the affected resource id.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: correlation_id
        in: query
        description: 'Filter by exact correlation ID (#2414) — the request''s

          `X-Correlation-ID` / trace ID as stored on each audit event.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: from
        in: query
        description: Inclusive lower time bound (RFC 3339).
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: to
        in: query
        description: Inclusive upper time bound (RFC 3339).
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: page
        in: query
        description: 1-based page index (default 1).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        description: Page size (default 50, max 200).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '403':
          description: Admin privileges required
      security:
      - bearer_auth: []
