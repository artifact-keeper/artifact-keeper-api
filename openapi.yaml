    StorageGcRequest:
      type: object
      description: 'Request body for storage GC.


        `dry_run` is **required** and unknown fields are **rejected** (#3501): a

        live GC pass is irreversible (no tombstone, no restore path short of a

        backup), so an ambiguous request must fail loudly instead of selecting the

        destructive branch. Before this, `{}` and any typo''d key

        (`{"dryRun": true}`, `{"dry_Run": true}`) silently deserialized to

        `dry_run: false` and performed a real deletion. Callers now say which pass

        they mean: `{"dry_run": true}` to estimate, `{"dry_run": false}` to

        delete; anything else is refused with an error naming the missing or

        unknown field (axum''s `Json` rejection, HTTP 422), and nothing is deleted.'
      required:
      - dry_run
      properties:
        dry_run:
          type: boolean
          description: 'When true, report what would be deleted without actually deleting.

            Required: an absent field is a rejected request, never a live delete.'
      additionalProperties: false
    StorageGcResult:
      type: object
      description: Result of a storage GC run.
      required:
      - dry_run
      - storage_keys_deleted
      - artifacts_removed
      - bytes_freed
      - errors
      properties:
        artifacts_removed:
          type: integer
          format: int64
        bytes_freed:
          type: integer
          format: int64
        dry_run:
          type: boolean
        errors:
          type: array
          items:
            type: string
        maven_flat_objects_gated:
          type: integer
          format: int64
          description: 'Orphaned row-less Maven flat objects this pass identified but left in

            place because the sweep is not opted in (`MAVEN_FLAT_GC_ENABLED`

            unset, #3431). Report-only: these objects and their attribution rows

            were NOT deleted and are not counted in `storage_keys_deleted`. Always

            `0` on a dry run (a dry run deletes nothing anyway) and when the sweep

            is enabled.'
        storage_keys_deleted:
          type: integer
          format: int64
    StorageReindexRequest:
      type: object
      description: 'Request body for a storage reindex. `dry_run` is required and unknown

        fields are rejected (the #3501 contract for write-capable admin calls).'
      required:
      - dry_run
      properties:
        dry_run:
          type: boolean
          description: Report what would be registered without writing any row.
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Register at most this many ghost objects in this call (default 1000,

            max 10000). `truncated` in the result says when more remain.'
          minimum: 0
      additionalProperties: false
    StorageReindexResult:
      type: object
      description: Result of one reindex call.
      required:
      - dry_run
      - scanned
      - registered
      - skipped
      - missing_objects
      - skipped_recent
      - skipped_unknown_age
      - truncated
      - registered_paths
      - missing_object_paths
      - errors
      properties:
        dry_run:
          type: boolean
        errors:
          type: array
          items:
            type: string
        missing_object_paths:
          type: array
          items:
            type: string
          description: Sample of paths whose row has no object.
        missing_objects:
          type: integer
          format: int64
          description: Live rows in the scanned namespace whose object is missing.
          minimum: 0
        registered:
          type: integer
          format: int64
          description: Rows created (or, on a dry run, that would be created).
          minimum: 0
        registered_paths:
          type: array
          items:
            type: string
          description: Sample of registered paths.
        scanned:
          type: integer
          format: int64
          description: Objects listed in the repository's key namespace.
          minimum: 0
        skipped:
          type: integer
          format: int64
          description: 'Objects left alone: already registered, row-less sidecar/metadata,

            not a Maven coordinate, or owned by a soft-deleted row.'
          minimum: 0
        skipped_recent:
          type: integer
          format: int64
          description: 'Unregistered objects modified within the last 5 minutes, left alone

            because their upload may still be committing its row.'
          minimum: 0
        skipped_unknown_age:
          type: integer
          format: int64
          description: 'Unregistered objects whose listing reported no modification time, left

            alone because they cannot be proven settled.'
          minimum: 0
        truncated:
          type: boolean
          description: True when `limit` stopped registration before every ghost was handled.
    StorageScrubRequest:
      type: object
      description: 'Request body for a storage scrub.


        `repair` is **required** and unknown fields are rejected, following the

        storage-GC request contract (#3501): the caller states whether the run may

        write to storage.'
      required:
      - repair
      properties:
        max_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Stop after reading this many bytes (default: `STORAGE_SCRUB_MAX_BYTES`).'
          minimum: 0
        max_objects:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Stop after this many objects (default: `STORAGE_SCRUB_MAX_OBJECTS`).'
          minimum: 0
        repair:
          type: boolean
          description: 'Restore a corrupt or missing object when another stored copy of the

            same digest re-hashes correctly. Without a verified copy the object is

            only reported; bytes are never overwritten with unverified data.'
        repository:
          type:
          - string
          - 'null'
          description: 'Only scrub this repository (by key). A scoped run starts from the

            beginning of the repository and leaves the instance-wide cursor alone.'
      additionalProperties: false
    StorageSnapshot:
      type: object
      description: A single day's storage metrics snapshot.
      required:
      - snapshot_date
      - total_repositories
      - total_artifacts
      - total_storage_bytes
      - total_downloads
      - total_users
      properties:
        proxy_artifact_count:
          type: integer
          format: int64
          description: 'Proxy-cached objects at snapshot time (migration 210). They carry no

            `artifacts` row (#1280), so this is disjoint from `total_artifacts`.

            0 for snapshots taken before migration 210 and on older payloads.'
        proxy_download_count:
          type: integer
          format: int64
          description: 'Pull-through serves, recorded in `proxy_download_statistics` rather

            than `download_statistics`, so this is disjoint from `total_downloads`.'
        proxy_storage_bytes:
          type: integer
          format: int64
          description: 'Bytes held by those objects — a *breakdown* of `total_storage_bytes`

            above, not a disjoint bucket: that total sums

            `repository_usage_ledger (hosted_bytes + proxy_bytes + oci_bytes)` and

            migration 182 defines `proxy_bytes` as exactly this sum, so the two

            must not be added. Same contract as the identically named

            `/admin/stats` field (#3134/#3249). (On `RepositoryStorageBreakdown`

            the same field name IS disjoint from that struct''s `storage_bytes`,

            which is hosted-only.)'
        snapshot_date:
          type: string
          format: date
        total_artifacts:
          type: integer
          format: int64
          description: 'Rows in `artifacts` (for OCI repositories that is manifests only —

            layer/config blobs are content-addressed objects, not artifacts), the

            same deliberate decision as the dashboard''s

            `SystemStats::total_artifacts` (#3134). Unlike the byte total, this

            count still includes legacy backfilled `proxy-cache/%` rows.'
        total_downloads:
          type: integer
          format: int64
        total_repositories:
          type: integer
          format: int64
        total_storage_bytes:
          type: integer
          format: int64
          description: 'All stored bytes at snapshot time, summed from

            `repository_usage_ledger` (`hosted_bytes + proxy_bytes + oci_bytes`) —

            the same source as the dashboard `total_storage_bytes` and quota

            admission (#3134/#3249), so the analytics series is consistent with

            both by construction. Includes OCI layer/config blob bytes

            (`oci_blobs`) and proxy-cached bytes (`proxy_cache_artifacts`);

            excludes legacy backfilled `proxy-cache/%` `artifacts` rows (their

            bytes are represented by the proxy-cache catalog instead). This is the

            LOGICAL figure: a blob cross-repo-mounted into N repositories counts

            once per repository, matching the per-repo storage column and quota.'
        total_users:
          type: integer
          format: int64
    StorageTreeNode:
      type: object
      description: One folder node in the per-prefix storage rollup (#2601).
      required:
      - prefix
      - depth
      - logical_bytes
      - physical_bytes
      - file_count
      - blob_count
      properties:
        blob_count:
          type: integer
          format: int64
          description: Distinct physical objects under this prefix.
        depth:
          type: integer
          format: int32
          description: Number of path segments in `prefix` (0 = root).
        file_count:
          type: integer
          format: int64
          description: References (artifact/proxy-cache rows) under this prefix.
        logical_bytes:
          type: integer
          format: int64
          description: Sum over every artifact/proxy-cache reference under this prefix.
        physical_bytes:
          type: integer
          format: int64
          description: 'Deduplicated within this repository: each distinct physical object

            under the prefix counted once. Because an object shared by two sibling

            subtrees counts once in each but once at their common ancestor, the sum

            of children''s `physical_bytes` can exceed the parent''s — the difference

            is the cross-subtree dedup saving.'
        prefix:
          type: string
          description: Canonical prefix (no leading/trailing `/`; `''` = repository root).
    StorageTreeQuery:
      type: object
      description: Query parameters for the per-prefix storage tree (#2601).
      properties:
        depth:
          type:
          - integer
          - 'null'
          format: int32
          description: 'How many tree levels below `prefix` to return (default 1 = immediate

            children, clamped to 1..=5).'
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Maximum number of descendant nodes returned (default 200, clamped to

            1..=1000). `truncated` is set when the limit cut the listing.'
        prefix:
          type:
          - string
          - 'null'
          description: 'Folder prefix to root the listing at (`''''`/absent = repository root).

            Leading/trailing slashes are ignored.'
