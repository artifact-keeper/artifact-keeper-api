        upstream_gpg_key_id:
          type:
          - string
          - 'null'
        verify_upstream_metadata:
          type:
          - boolean
          - 'null'
    DebianMetadataStrategy:
      type: string
      description: 'How metadata (`Packages`/`Release`) is produced for a Debian remote.


        Only [`DebianMetadataStrategy::UpstreamPassthrough`] is implemented in

        1.6.0; the other variants are reserved for P3 (filtered generation) / P4

        (local re-signing) and are rejected with 422 until then. The enum lands now

        so those phases can flip it on without a schema/config-shape change.'
      enum:
      - upstream_passthrough
      - filter_and_generate
      - filter_generate_and_sign
      - hosted_generate
    DebianPackageFetchStrategy:
      type: string
      description: 'How package bodies are fetched for a Debian remote.


        Only [`DebianPackageFetchStrategy::UpstreamPassthrough`] is implemented in

        1.6.0.'
      enum:
      - upstream_passthrough
      - eager
    DebianRepositoryConfig:
      type: object
      description: 'P2 Debian remote proxy filter config (dist/component/arch allowlists).


        Semantics for each allowlist: an empty list OR a list containing `"*"`

        selects everything (today''s full-proxy behaviour); otherwise only exact

        matches are selected. Architecture-independent (`all`) packages are always

        permitted regardless of the `architectures` allowlist.'
      properties:
        allow_encoded_separators:
          type: boolean
          description: 'Defense-in-depth (#2562): when `false` (the default) a proxy request

            whose path carries a percent-encoded path separator (`%2f` = `/`,

            `%5c` = `\`, at any decode layer) is rejected with 400 before any

            upstream fetch. APT never percent-encodes path separators, so this only

            ever blocks path-confusion/traversal probes; set it `true` to opt out

            for a nonstandard upstream that genuinely requires encoded separators.'
        architectures:
          type: array
          items:
            type: string
          description: 'Architectures (e.g. `amd64`, `arm64`) to proxy. Empty/`["*"]` = all.

            `all` (arch-independent) is always permitted.'
        components:
          type: array
          items:
            type: string
          description: Components (e.g. `main`, `contrib`, `non-free`) to proxy. Empty/`["*"]` = all.
        distribution_paths:
          type: array
          items:
            type: string
          description: 'Distributions (a.k.a. suites/codenames, e.g. `bookworm`) to proxy.

            Empty or `["*"]` = all.'
        flat_repository:
          type: boolean
          description: 'Flat (non-`dists/`) repository layout flag. Accepted but does NOT weaken

            P1''s flat/redirect abuse posture in passthrough.'
        include_source_packages:
          type: boolean
          description: 'Whether source packages (`Sources`, `.dsc`) are included. Advisory in

            passthrough (upstream metadata is unchanged); honored under P3.'
        metadata_strategy:
          $ref: '#/components/schemas/DebianMetadataStrategy'
          description: Metadata production strategy. Only `upstream_passthrough` in 1.6.0.
        package_fetch_strategy:
          $ref: '#/components/schemas/DebianPackageFetchStrategy'
          description: Package-body fetch strategy. Only `upstream_passthrough` in 1.6.0.
        package_queries:
          type: array
          items:
            type: string
          description: 'Package-name-level queries. NOT honored in passthrough (that needs P3);

            a non-empty value here with `upstream_passthrough` is rejected with 422

            rather than silently advertising content the proxy would then block.'
        upstream_gpg_key_id:
          type:
          - string
          - 'null'
          description: Upstream GPG key id used to verify upstream metadata (reserved for P4).
        verify_upstream_metadata:
          type: boolean
          description: 'Whether to verify the upstream signed `Release` before serving. In P2 the

            P1 integrity gate already enforces index/Release consistency; this flag

            is reserved for P4 trust-anchor verification.'
    DeliveryListResponse:
