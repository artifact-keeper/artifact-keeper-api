  /api/v1/uploads/{session_id}/complete:
    put:
      tags:
      - uploads
      operationId: complete
      parameters:
      - name: session_id
        in: path
        description: Upload session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Upload finalized, artifact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
        '400':
          description: Incomplete chunks or invalid state, or the session's repository is virtual (the session is failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: The session's repository is remote (proxy); direct uploads are not accepted and the session is failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict, for one of two reasons that the status code alone does not distinguish; read the response
            body to tell them apart. (1) Checksum mismatch: the assembled file''s SHA-256 differs from the checksum declared
            when the session was created. The body is `{"error": "checksum mismatch: expected <sha256>, got <sha256>"}`; the
            session is failed, so re-upload in a new session. (2) Immutable path occupied (#3924): an artifact already exists
            at this path and may not be overwritten. The body is `{"code": "CONFLICT", "message": "Artifact version already
            exists and is immutable"}`; no bytes are written and the session stays open, so this request can be repeated once
            the occupying artifact is deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Session expired, or created by an earlier server version and not resumable; start a new session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Staging storage or database temporarily unavailable; the session is left completable, retry (honour
            Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
