            config value. Defaulted on deserialization so it is not required in the

            update-settings request body.'
        max_upload_size_bytes:
          type: integer
          format: int64
        retention_days:
          type: integer
          format: int32
        storage_backend:
          type: string
        storage_path:
          type: string
    SystemStats:
      type: object
      required:
      - total_repositories
      - total_artifacts
      - total_storage_bytes
      - total_downloads
      - total_users
