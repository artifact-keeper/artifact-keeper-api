          type: boolean
        filter:
          type: string
          description: 'Convenience glob filter, mirrored from `artifact_filter.include_paths`.

            Round-trips the single-pattern shorthand accepted on create

            (e.g. `"*.tar.gz"`). Empty when no include pattern is set.'
        id:
          type: string
          format: uuid
        name:
          type: string
        peer_selector:
          type: object
