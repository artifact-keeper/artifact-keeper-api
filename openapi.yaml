      - admin
      summary: Read the API token expiration policy.
      operationId: get_token_policy
      responses:
        '200':
          description: Current API token expiration policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPolicyResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    put:
      tags:
      - admin
      summary: Change the API token expiration policy.
      description: 'Takes effect immediately for NEW token mints only; tokens that already

        exist keep whatever `expires_at` (including none) they were minted with,

        so enabling enforcement can never invalidate a credential a pipeline is

        already running on. The response''s `non_expiring_*` counts are the

        inventory to rotate manually if the security posture requires it.'
      operationId: update_token_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTokenPolicyRequest'
        required: true
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPolicyResponse'
        '400':
          description: Inconsistent policy (range/default contradiction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Refused: policy pinned by API_TOKEN_EXPIRATION_* environment variables'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/admin/settings/totp-policy:
    get:
      tags:
      - admin
      summary: Read the system-wide 2FA enforcement policy.
      operationId: get_totp_policy
      responses:
        '200':
          description: Current 2FA enforcement policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpPolicyResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
    put:
      tags:
      - admin
      summary: Change the system-wide 2FA enforcement policy.
      description: 'Tightening the policy requires the calling administrator to have TOTP

        enabled — that is the lockout-safety guard: it guarantees at least one

        administrator whose (pre-existing, already-working) sign-in path survives the

        change. Loosening is never refused. A policy change does **not** invalidate

        existing sessions or refresh tokens; it takes effect at the next interactive

        password login, so the administrator making the change keeps their session.'
      operationId: update_totp_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTotpPolicyRequest'
        required: true
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpPolicyResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Refused: policy pinned by TOTP_POLICY, or the calling admin has not enrolled in TOTP'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
