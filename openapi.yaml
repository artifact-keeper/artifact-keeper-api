      tags:
      - repositories
      summary: Replace the full member set of a virtual repository (add / remove / reorder).
      description: 'Replace the full member set of a virtual repository. This is a full-set replace, not a partial update:
        the request body is the complete desired member list. Any existing member that is not present in the body is removed.
        Members present in the body are inserted if missing, or have their priority updated if already present. An empty `members`
        array removes every member. Warning: sending a partial list in order to reorder priorities will delete the members
        omitted from that list, so clients must always send the complete member list. These semantics were introduced in PR
        #2795 (issue #2785) and ratified in issue #2899.'
      operationId: update_virtual_members
      parameters:
      - name: key
        in: path
        description: Repository key
