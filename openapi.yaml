            artifacts without authentication. Useful for remote (pull-through cache)

            repositories that proxy public upstream registries. Write operations

            (upload, delete) still require authentication regardless of this setting.

            If both `is_public` and `allow_anonymous_access` are provided,

            `allow_anonymous_access` takes precedence.'
        apt_description:
          type:
          - string
          - 'null'
          description: 'Custom Description field for Debian/APT Release files. Pass an empty

            string to remove (omits the field entirely from the Release file).

            Stored in `repository_config` under `apt_description`.'
        apt_label:
          type:
          - string
          - 'null'
          description: 'Custom Label field for Debian/APT Release files. Pass an empty string

            to reset to the default ("artifact-keeper").

            Stored in `repository_config` under `apt_label`.'
        apt_origin:
          type:
          - string
          - 'null'
          description: 'Custom Origin field for Debian/APT Release files. Pass an empty string

            to reset to the default ("artifact-keeper").

            Stored in `repository_config` under `apt_origin`.'
        apt_release_version:
          type:
          - string
          - 'null'
          description: 'Custom Version field for Debian/APT Release files. Pass an empty

            string to remove (omits the field entirely from the Release file).

            Stored in `repository_config` under `apt_release_version`.'
        curation_allow_unverified:
          type:
          - boolean
          - 'null'
          description: 'Update the keyless-sync unverified-ingest opt-in (#2569). When provided,

            sets `curation_allow_unverified` (`false` restores the fail-closed

            default; `true` opts into legacy unverified ingest). Omit to leave it

            unchanged.'
        curation_default_action:
          type: string
          description: 'Default curation action when no rule matches: allow or review.

            "block" is rejected (DB CHECK, migration 071); use block rules for

            specific packages instead.


            The allowed set is spelled out in the schema so a generated SDK presents it

            rather than an unconstrained string.'
          example: allow
        curation_enabled:
          type:
          - boolean
          - 'null'
          description: Enable curation-rule enforcement on this repository's proxy paths.
        custom_user_agent:
          type:
          - string
          - 'null'
          description: 'Update the custom User-Agent for outbound HTTP requests to the upstream.

            Only valid for remote repositories. Pass an empty string to remove.

            Max 256 characters. Stored in `repository_config` under `custom_user_agent`.'
        debian:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DebianConfigPatch'
            description: 'Update the Debian remote proxy filter (#2460). Three-way semantics:

              omit the field to leave the stored config unchanged; send `null` to

              clear it (revert to full-proxy); send an object to merge a partial

              update onto the stored config. Only valid for Debian Remote repos.'
        description:
          type:
          - string
          - 'null'
        index_upstream_url:
          type:
          - string
          - 'null'
          description: 'Update the Cargo index upstream URL (stored in `repository_config`).

            When provided, upserts the `index_upstream_url` key for this repository.'
        is_public:
          type:
          - boolean
          - 'null'
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        npm_allow_unscoped:
          type:
          - boolean
          - 'null'
          description: 'Update whether unscoped npm package names may resolve through this npm

            Remote repository (#2424). Stored under `npm_allow_unscoped`.'
        npm_allowed_name_patterns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Update the allowed npm full-name glob patterns for this npm Remote

            repository (#2424). When provided, replaces the stored

            `npm_allowed_name_patterns` list.'
        npm_allowed_scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Update the allowed npm `@scope` literals for this npm Remote repository

            (#2424). When provided, replaces the stored `npm_allowed_scopes` list.'
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Assign this repository to a project (#2472). P1 is set-only: omitting

            the field leaves the assignment unchanged (unassignment ships with the

            project-admin surface in P2).'
        promotion_only:
          type:
          - boolean
          - 'null'
          description: 'When provided, enables/disables the `promotion_only` policy for this

            repository (admin-only). When omitted, the flag is left unchanged.'
        pypi_upstream_index_path:
          type:
          - string
          - 'null'
          description: 'Update the PyPI simple-index prefix (stored in `repository_config` under

            `pypi_upstream_index_path`). Pass `""` for flat CDN layout, `"simple"` to

            restore the PEP 503 default, or any other non-empty string for a custom prefix.

            Only meaningful for PyPI / Poetry / Jupyter / Conda Remote repositories.'
        quarantine_duration_minutes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Quarantine hold duration in minutes for this repository.

            Stored in `repository_config` under `quarantine_duration_minutes`.'
        quarantine_enabled:
          type:
          - boolean
          - 'null'
          description: 'Enable or disable quarantine period for this repository.

            When enabled, newly uploaded artifacts are held until scanned.

            Stored in `repository_config` under `quarantine_enabled`.'
        quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
        release_repository_key:
          type:
          - string
          - 'null'
          description: 'Link this staging repository to a release (local) repository.

            Promotions from this staging repo will default to the linked release repo,

            and promotions to any other repo will be rejected.

            Pass an empty string to remove the link.

            Stored in `repository_config` under `release_repository_id`.'
        trusted_gpg_key:
          type:
          - string
          - 'null'
          description: 'Update the trusted upstream OpenPGP public key for RPM curation (#2568).

            Three-way semantics via `Option<Option<String>>`: omit the field to

            leave the stored key unchanged; send `null` to clear it (revert to

            "unverified upstream"); send an ASCII-armored PUBLIC key block to set

            it. A private-key block or malformed armor is rejected (400). The

            response never echoes the key — only `has_trusted_gpg_key`.'
        versioning_enabled:
          type:
          - boolean
          - 'null'
          description: 'When provided, enables/disables first-class artifact versioning for

            this Generic/Mlmodel repository (#2367). When omitted, unchanged.'
    UpdateRuleRequest:
      type: object
      properties:
        allowed_licenses:
          type:
          - array
          - 'null'
          items:
            type: string
        auto_promote:
          type:
          - boolean
          - 'null'
        is_enabled:
          type:
          - boolean
          - 'null'
        max_artifact_age_days:
          type:
          - integer
          - 'null'
          format: int32
        max_cve_severity:
          type:
          - string
          - 'null'
        min_health_score:
          type:
          - integer
          - 'null'
          format: int32
        min_staging_hours:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type:
          - string
          - 'null'
        require_signature:
          type:
          - boolean
          - 'null'
    UpdateSamlConfigRequest:
      type: object
      properties:
        admin_group:
          type:
          - string
          - 'null'
        attribute_mapping:
          type:
          - object
          - 'null'
        certificate:
          type:
          - string
          - 'null'
        entity_id:
          type:
          - string
          - 'null'
        is_enabled:
          type:
          - boolean
          - 'null'
        map_groups_to_groups:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        name_id_format:
          type:
          - string
          - 'null'
        require_signed_assertions:
          type:
          - boolean
          - 'null'
        sign_requests:
          type:
          - boolean
          - 'null'
        slo_url:
          type:
          - string
          - 'null'
        slug:
          type:
          - string
          - 'null'
          description: 'Set or change the URL-safe alias (#2583). Omitting it preserves the

            current value, matching how `slo_url` and `admin_group` behave; a

            slug therefore cannot be cleared through this endpoint, only

            replaced, so an ACS URL an IdP is already configured with cannot be

            removed by an update that simply forgot to mention it.'
        sp_entity_id:
          type:
          - string
          - 'null'
        sso_url:
          type:
          - string
          - 'null'
        use_absolute_acs_url:
          type:
          - boolean
          - 'null'
    UpdateServiceAccountRequest:
      type: object
      properties:
        display_name:
          type:
          - string
          - 'null'
        is_active:
          type:
          - boolean
          - 'null'
    UpdateSigningConfigPayload:
      type: object
      properties:
        require_signatures:
          type:
          - boolean
          - 'null'
        sign_metadata:
          type:
          - boolean
          - 'null'
        sign_packages:
          type:
          - boolean
          - 'null'
        signing_key_id:
          type:
          - string
          - 'null'
          format: uuid
    UpdateSyncPolicyPayload:
      type: object
      properties:
        artifact_filter:
          type: object
        description:
          type:
          - string
          - 'null'
        enabled:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        peer_selector:
          type: object
        precedence:
          type:
          - integer
          - 'null'
          format: int32
        priority:
          type:
          - integer
          - 'null'
          format: int32
        replication_mode:
          type:
          - string
          - 'null'
        repo_selector:
          type: object
    UpdateTokenPolicyRequest:
      type: object
      description: Request body for `PUT /admin/settings/token-policy`.
      required:
      - policy
      properties:
        policy:
          $ref: '#/components/schemas/ApiTokenExpiryPolicy'
    UpdateTotpPolicyRequest:
      type: object
      description: Request body for `PUT /admin/settings/totp-policy`.
      required:
      - policy
      properties:
        policy:
          $ref: '#/components/schemas/TotpPolicy'
    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        is_active:
          type:
          - boolean
          - 'null'
        is_admin:
          type:
          - boolean
          - 'null'
    UpdateVirtualMembersRequest:
      type: object
      description: 'Full-set replace of a virtual repository''s members (PR #2795, issue #2785;

        ratified in issue #2899).


        This body is the COMPLETE desired member list, not a partial patch. Any

        current member whose key is absent from `members` is removed; keys present

        are inserted or have their priority updated. An empty `members` array

        removes every member.


        WARNING: sending a partial list to reorder priorities deletes the omitted

        members. Clients must always send the full member list.'
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/VirtualMemberPriority'
          description: The complete desired member set. Members not listed here are removed.
    UpsertLicensePolicyRequest:
      type: object
      required:
      - name
      - allowed_licenses
      - denied_licenses
      properties:
        action:
          type: string
        allow_unknown:
          type: boolean
        allowed_licenses:
          type: array
          items:
            type: string
        denied_licenses:
          type: array
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        is_enabled:
          type: boolean
        name:
          type: string
        repository_id:
          type:
          - string
          - 'null'
          format: uuid
    UpsertScanConfigRequest:
      type: object
      description: 'Request to create or update a scan configuration.


        Every field is optional so a `PUT /repositories/{key}/security` can carry

        any subset of mutable columns; fields the client omits keep their existing

        value (or fall back to the documented default when the row does not exist

        yet). The previous shape required all of `scan_enabled`, `scan_on_upload`,

        `scan_on_proxy`, `block_on_policy_violation`, `severity_threshold` on every

        call. That was the #1374 bug class on a second entity: a partial PUT (for

        example just `{scan_enabled: true}`) either bounced as a 422 or, worse,

        silently reset every other column to its default so a follow-up GET showed

        the untouched fields stale. The upsert is now a read-modify-write that

        merges the patch over the existing row, so multiple fields persist together

        and an omitted field is never clobbered. See #1374 / B11.'
      properties:
        block_on_policy_violation:
          type:
          - boolean
          - 'null'
          description: 'Opt-in that makes `severity_threshold` enforced on the proxy/OCI

            inline scan gate (#3243/#3246). Default false = block on any finding.'
        proxy_scan_action:
          type:
          - string
          - 'null'
          description: '#2954: `''fail_open''` (default) | `''fail_closed''` for the inline proxy

            scan-on-fetch action.'
        scan_enabled:
          type:
          - boolean
          - 'null'
        scan_on_proxy:
          type:
          - boolean
          - 'null'
        scan_on_upload:
          type:
          - boolean
          - 'null'
        severity_threshold:
          type:
          - string
          - 'null'
          description: 'Severity floor for the inline proxy scan gate, live only when

            `block_on_policy_violation` is set (#3243/#3246).'
    UpstreamAuthRequest:
      type: object
      required:
      - auth_type
      properties:
        auth_type:
          type: string
          description: 'Auth type: "basic", "bearer", "aws_ecr", "aws_codeartifact", or "none"

            to remove.'
        aws:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AwsUpstreamAuthRequest'
            description: 'Provider settings for the dynamic AWS auth types (#1559). Required for

              `aws_ecr` and `aws_codeartifact`, ignored otherwise.


              Carries no secret: the AWS identity comes from the process''s default

              credential chain (IRSA / EKS Pod Identity / instance profile / static

              `AWS_*` environment keys), never from this request.'
        password:
          type:
          - string
          - 'null'
          description: Password (basic) or token (bearer). Write-only, never returned.
        username:
          type:
          - string
          - 'null'
          description: Username for basic auth.
    UserListResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UserResponse:
      type: object
      required:
      - id
      - username
      - email
      - is_admin
      - totp_enabled
      properties:
        display_name:
          type:
          - string
          - 'null'
        email:
          type: string
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
        totp_enabled:
          type: boolean
        username:
          type: string
    VersionResponse:
      type: object
      required:
      - repository
      - version_number
      - package_count
      - published
      properties:
        package_count:
          type: integer
          format: int64
          description: The number of approved packages frozen into the snapshot.
        published:
          type: boolean
          description: Whether this version's signed repodata has been published yet.
        repository:
          type: string
          description: The repository key the version belongs to.
        version_number:
          type: integer
          format: int64
          description: The monotonic snapshot number (published/served under `/rpm/{key}/@N/`).
    VirtualMemberPriority:
      type: object
      required:
      - member_key
      - priority
      properties:
        member_key:
          type: string
          description: Key of the member repository. Inserted if it is not already a member.
        priority:
          type: integer
          format: int32
          description: Resolution priority. Lower values are searched first.
    VirtualMemberResponse:
      type: object
      required:
      - id
      - member_repo_id
      - member_repo_key
      - member_repo_name
      - member_repo_type
      - priority
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        member_repo_id:
          type: string
          format: uuid
        member_repo_key:
          type: string
        member_repo_name:
          type: string
        member_repo_type:
          type: string
        priority:
          type: integer
          format: int32
    VirtualMembersListResponse:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/VirtualMemberResponse'
    WasmPluginResponse:
      type: object
      description: WASM plugin response with extended fields
      required:
      - id
      - name
      - version
      - display_name
      - status
      - plugin_type
      - source_type
      - capabilities
      - resource_limits
      - installed_at
      - updated_at
      properties:
        author:
          type:
          - string
          - 'null'
        capabilities:
          type: object
        description:
          type:
          - string
          - 'null'
        display_name:
          type: string
        enabled_at:
          type:
          - string
          - 'null'
          format: date-time
        homepage:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        installed_at:
          type: string
          format: date-time
        license:
          type:
          - string
          - 'null'
        name:
          type: string
        plugin_type:
          type: string
        resource_limits:
          type: object
        source_ref:
          type:
          - string
          - 'null'
        source_type:
          type: string
        source_url:
          type:
          - string
          - 'null'
        status:
          type: string
        updated_at:
          type: string
          format: date-time
        version:
          type: string
    WebhookEvent:
      type: string
      description: Webhook event types
      enum:
      - artifact_uploaded
      - artifact_deleted
      - repository_created
      - repository_deleted
      - user_created
      - user_deleted
      - build_started
      - build_completed
      - build_failed
      - age_gate_queued
      - age_gate_approved
      - age_gate_rejected
      - age_gate_reopened
    WebhookListResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
        total:
          type: integer
          format: int64
    WebhookResponse:
      type: object
      required:
      - id
      - name
      - url
      - events
      - is_enabled
      - payload_template
      - event_schema_version
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        event_schema_version:
          type: string
          description: 'Pinned event payload version (e.g. "2026-04-01"). Determines the

            shape of the rendered payload and the value sent in the

            `X-ArtifactKeeper-Event-Version` header.'
        events:
          type: array
          items:
            type: string
        headers:
          type:
          - object
          - 'null'
        id:
          type: string
          format: uuid
        is_enabled:
          type: boolean
        last_triggered_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        payload_template:
          $ref: '#/components/schemas/PayloadTemplate'
        repository_id:
          type:
          - string
          - 'null'
          format: uuid
        secret_digest:
          type:
          - string
          - 'null'
          description: 'Short non-reversible identifier for the current signing secret

            (`whsec_...abcd`), suitable for display in operator UIs. The raw

            secret is never returned by GET or LIST.'
        secret_rotation_active:
          type: boolean
          description: 'True while a previous secret is still accepted by the retry path

            during a rotation overlap window.'
        url:
          type: string
    WebhookSecretCreatedResponse:
      allOf:
      - $ref: '#/components/schemas/WebhookResponse'
      - type: object
        properties:
          secret:
            type:
            - string
            - 'null'
            description: 'Raw signing secret. Display this to the operator immediately and

              instruct them to record it; the server retains only the encrypted

              form and a short digest.


              Absent when the webhook was created without a signing secret. This

              happens when no secret was supplied and the deployment has no

              `AK_WEBHOOK_SECRET_KEY` configured: rather than fail the create with

              a 500, the webhook is stored unsigned and deliveries omit the

              signature header. Configure the key and rotate the secret later to

              enable signing.'
      description: 'Response returned exactly once when a webhook is created or its secret

        is rotated. The raw `secret` value is not retrievable afterwards.'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
      description: Format (package-manager) endpoints only. Accepts a `username:password` login, or an API token in the password
        field (any username) for `pip` netrc / Artifactory-style clients. Not accepted as a token carrier on `/api/v1/*`.
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Canonical scheme for `/api/v1/*`. Send an API token or a login-issued JWT as `Authorization: Bearer <token>`.'
