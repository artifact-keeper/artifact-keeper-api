            type: string
          description: 'Allowed npm `@scope` literals for this npm Remote repository (#2424).

            Only meaningful for npm-format Remote repositories; validated and stored

            in `repository_config` under `npm_allowed_scopes`. Omit to leave the

            repository unrestricted by scope.'
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Optional project to assign this repository to (#2472). Grants on the

            project (permissions with `target_type = ''project''`) are inherited by

            the repository. Omit to leave the repository unassigned.'
        promotion_only:
          type:
          - boolean
          - 'null'
          description: 'When true, direct user uploads to this repository are rejected:

            artifacts must arrive via the promotion path. Admin-only to set.

            Defaults to false (no behavior change for existing repositories).'
        pypi_upstream_index_path:
          type:
          - string
          - 'null'
          description: "Override the PyPI simple-index prefix for upstreams that do not follow\nthe standard PEP 503 `/simple/`\
            \ layout (issue #1546).\n\n- Omit or `\"simple\"` — standard PEP 503 (pypi.org, devpi, Nexus). Default.\n- `\"\
            \"` (empty) — flat CDN (e.g. `https://download.pytorch.org/whl/cpu`):\n  package files are served directly under\
            \ the upstream root with no prefix.\n- Any other non-empty string — custom index prefix.\n\nStored in `repository_config`\
            \ under `pypi_upstream_index_path`.\nOnly meaningful for PyPI / Poetry / Jupyter / Conda Remote repositories."
        quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
        repo_type:
          type: string
        storage_backend:
          type:
          - string
          - 'null'
          description: 'Override the default storage backend for this repository.

            When omitted, the server''s configured default is used.

            Non-admin users may only use the default backend.'
        trusted_gpg_key:
          type:
