      summary: Get the per-prefix (folder tree) storage rollup for a repository (#2601).
      description: 'Returns the requested prefix''s own rollup plus its descendant folder nodes

        (default: immediate children) from the materialized per-prefix cache. Same

        visibility rules as `get_repository`: public repos and repo members pass;

        everyone else gets an existence-hiding 404.'
      operationId: get_repository_storage_tree
      parameters:
      - name: key
        in: path
