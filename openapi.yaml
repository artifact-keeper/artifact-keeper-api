openapi: 3.1.0
info:
  title: Artifact Keeper API
  description: 'Enterprise artifact registry supporting 45+ package formats.


    ## Authentication


    The JSON management API under `/api/v1/*` accepts **API tokens only as `Authorization: Bearer <token>`**. This is the
    canonical scheme for programmatic access; JWTs issued by the login flow also use `Bearer`. HTTP Basic credentials on `/api/v1/*`
    are validated *only* as a real `username:password` login — the password half is **not** retried as an API token. A request
    to `/api/v1/*` that sends an API token in the password field of Basic auth therefore returns `401 AUTH_ERROR`; switch
    to `Authorization: Bearer <token>`.


    Format (package-manager) endpoints such as `/v2/*` (OCI), `/incus/*`, `/debian/*`, and the language registries are intentionally
    more permissive for client compatibility: in addition to Bearer, they accept HTTP **Basic** auth with the API token supplied
    in the *password* field (any username), matching the `pip` netrc / Artifactory-style `token:<api_token>` convention used
    by package managers that cannot send a Bearer header. This Basic-with-token fallback applies to format endpoints only,
    never to `/api/v1/*`.'
  contact:
    name: Artifact Keeper
    url: https://artifactkeeper.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.11.0
