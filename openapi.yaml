          type: integer
          format: int64
          description: 'Downloads served by this repository''s remote pull-through proxy

            (`proxy_download_statistics`, #2537/#2704). Proxy-cached objects carry

            no `artifacts` row (#1280), so these serves are counted in a sibling

            table and were previously not readable through any API. Kept separate

            from `download_count` (hosted serves) so existing consumers are

            unaffected; defaults to 0 when deserializing older payloads.'
        proxy_storage_bytes:
          type: integer
          format: int64
        repository_id:
          type: string
          format: uuid
        repository_key:
          type: string
        repository_name:
          type: string
        storage_bytes:
          type: integer
          format: int64
    RepositoryStorageStatsResponse:
      type: object
      description: 'Deduplicated storage-accounting response for a single repository (#2056).


        All figures are read from the materialized `repository_storage_stats` cache

        (refreshed on a schedule + post-GC), so this endpoint is an O(1) primary-key

        lookup and never runs the heavy cross-repo aggregation. `computed_at` is the

        freshness marker; it is `null` until the first refresh has run.


        Quota is unaffected: these numbers are accounting/visibility only and do NOT

        change how the repository''s storage quota is enforced (#2056 §7).


        Known bounded exclusion: OCI *manifest* JSON objects are not weighed. Their

        `artifacts.size_bytes` holds the aggregate image size, not the stored

        object, so counting it would double the layer bytes (#3286); no column holds

        the manifest''s true size. Manifests are a few KB each, so every figure below

        under-reports by roughly that much per tag (#3618).'
      required:
      - repository_key
      - logical_bytes
      - blob_count
      - dedup_scope
      properties:
        blob_count:
          type: integer
          format: int64
          description: Distinct physical objects (dedup keys) this repository references.
        computed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When these figures were last recomputed. `null` before the first refresh.
        dedup_ratio:
          type:
          - number
          - 'null'
          format: double
          description: 'logical_bytes / physical_bytes (1.0 when nothing is stored). Restricted

            on cloud backends — see [`physical_bytes`](Self::physical_bytes).'
        dedup_scope:
          type: string
          description: '`per_repo` (filesystem) or `instance` (cloud) — the backend semantics at

            compute time.'
        instance_unique_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'The instance-wide globally-distinct footprint (true disk usage). On

            cloud backends the sum of per-repo `physical_bytes` OVER-counts shared

            objects, so this is the authoritative instance total.


            **Admin-only:** this is a whole-instance aggregate that spans every

            tenant, so it is only populated for admin callers. It is omitted from the

            response entirely for repo-authorized non-admins and anonymous callers,

            who see only this repository''s own figures (#2559 review).'
        logical_bytes:
          type: integer
          format: int64
          description: 'Sum over every reference (per-row). Now includes OCI layer bytes, which

            were previously omitted from all storage accounting.'
        physical_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Deduplicated physical footprint within the dedup scope.


            **Restricted on cloud (instance-scope) backends:** on a shared-storage

            backend `physical_bytes`, `unique_bytes`, `shared_bytes` and

            `dedup_ratio` are all cross-tenant-derivable — `shared_bytes =

            physical_bytes - unique_bytes` reveals whether this repo''s blobs are also

            stored by another tenant (a per-blob cross-tenant existence oracle,

            #2560). The whole derivable set is therefore populated only for admins on

            instance-scope backends, and omitted for repo-authorized non-admins /

            anonymous callers. On `per_repo` (filesystem) backends there is no

            cross-tenant sharing (`shared_bytes == 0` by construction), so all

            figures are always present.'
        repository_key:
          type: string
        shared_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'physical_bytes - unique_bytes. Always 0 on filesystem backends (a shared

            digest in two repos is two files). Restricted on cloud backends — see

            [`physical_bytes`](Self::physical_bytes).'
        unique_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Physical bytes of objects referenced only by this repository.

            Restricted on cloud backends — see [`physical_bytes`].


            [`physical_bytes`]: Self::physical_bytes'
    RepositoryStorageTreeResponse:
      type: object
      description: 'Per-prefix (folder tree) storage rollup response (#2601).


        All figures are read from the materialized `repository_path_storage_stats`

        cache (refreshed on the storage-stats schedule + post-GC) — a tree call is

        an index scan over pre-aggregated rows, never a walk of the artifact table.


        Every figure is within-repository only (references this repo holds), so

        unlike the repo-level endpoint''s cross-tenant-derivable dedup breakdown

        (#2560) nothing here needs an admin restriction beyond repo visibility.'
      required:
      - repository_key
      - node
      - children
      - truncated
      - max_materialized_depth
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/StorageTreeNode'
          description: 'Descendant folder nodes, up to `depth` levels below `node`, largest

            `logical_bytes` first.'
        computed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the rollup was last recomputed. `null` before the first refresh.
        max_materialized_depth:
          type: integer
          format: int32
          description: 'Folder levels below the root that are individually materialized;

            deeper files roll up into their ancestor at this depth.'
        node:
          $ref: '#/components/schemas/StorageTreeNode'
          description: 'The node the listing is rooted at (zeros when the prefix has no

            materialized data — unknown folder or refresher not yet run).'
        repository_key:
          type: string
        truncated:
          type: boolean
          description: True when `limit` cut the descendant listing.
        unattributed_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Bytes referenced by this repository that carry no logical path and so

            cannot be placed in the tree (today: OCI layer blobs; the blob→image

            edge lives only in manifest content). Root-level figure; present only

            when the request is rooted at `''''`. `node.logical_bytes +

            unattributed_bytes` reconciles with the repo-level logical total.'
    RescanForInventoryRequest:
      type: object
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Maximum number of artifacts to enqueue in this call. Operators

            run the endpoint repeatedly to drain large backfills without

            stalling a single HTTP worker; the handler returns the actual

            number enqueued so the caller can detect when work is done.

            Defaults to 100. Hard-capped at 1000 to avoid pathological inputs.'
    RescanForInventoryResponse:
      type: object
