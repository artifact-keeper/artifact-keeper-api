              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: Artifact or repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pending approval already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/approval/{id}:
    get:
      tags:
      - approval
      summary: Get a single approval request by ID.
      operationId: get_approval
      parameters:
      - name: id
        in: path
        description: Approval request ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/approval/{id}/approve:
    post:
      tags:
      - approval
      summary: Approve a pending promotion request. Admin-only.
      description: 'This copies the artifact from the staging repo to the release repo,

        inserts the new artifact record, records promotion history, and

        updates the approval status to "approved".'
      operationId: approve_promotion
      parameters:
      - name: id
        in: path
        description: Approval request ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          description: Promotion approved and executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Approval already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/approval/{id}/reject:
    post:
      tags:
      - approval
      summary: Reject a pending promotion request. Admin-only.
      operationId: reject_promotion
      parameters:
      - name: id
        in: path
        description: Approval request ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          description: Promotion rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Approval already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/artifacts/{id}:
    get:
      tags:
      - artifacts
      summary: Get artifact by ID
      operationId: get_artifact
      parameters:
      - name: id
        in: path
        description: Artifact ID
