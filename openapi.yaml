          type: integer
          format: int64
          description: Repositories whose ledger total changed.
        repositories_skipped:
          type: integer
          format: int64
          description: 'Repositories deleted between the scan and their recompute. Not an

            error — the ledger row went with them.'
        total_drift_bytes:
          type: integer
          format: int64
          description: Sum of the absolute per-repository corrections, in bytes.
