    OriginPolicyPredicates:
      type: object
      description: 'Cross-format policy predicates over the artifact''s recorded origin

        (`artifacts.origin`, #4050).


        Unlike the format-scoped `conda` block, origin is a fact every artifact

        carries regardless of format — where the bytes came from matters as

        much for a Maven jar as for a conda package — so this block sits at the

        top level of the predicates document next to `conda`, not inside it.


        Every field is optional in effect: empty lists mean the predicate is

        not enforced. Lists are the organisation''s own allow/deny values — the

        product ships the mechanism, never a seeded list.'
      properties:
        allowed_kinds:
          type: array
          items:
            type: string
          description: 'Non-empty: the artifact''s ingest kind (`hosted`, `proxy`,

            `virtual`, `migration`) must be in this set — e.g. `["hosted"]`

            refuses anything that arrived through a proxy or migration.'
          default: []
        allowed_repositories:
          type: array
          items:
            type: string
          description: 'Non-empty: the key of the repository the artifact was uploaded to,

            fetched through, or imported into must be in this set.'
          default: []
        allowed_upstreams:
          type: array
          items:
            type: string
          description: 'Non-empty: the artifact''s normalized upstream URL must be in this

            set. An artifact with no recorded upstream (a hosted upload, or an

            origin recorded before the upstream was known) fails closed — the

            predicate exists to prove which upstream supplied the bytes, and

            an unknown upstream proves nothing. Case-insensitive.'
          default: []
        denied_repositories:
          type: array
          items:
            type: string
          description: 'The artifact''s recording repository key must not be in this set —

            the defence against a lower-trust repository shadowing content

            that should only come from a higher-trust one.'
          default: []
        denied_upstreams:
          type: array
          items:
            type: string
          description: 'The artifact''s normalized upstream URL must not be in this set.

            Case-insensitive.'
          default: []
    PackageAnalysisResponse:
      type: object
      description: Everything we learned by reading an artifact's own bytes.
      required:
      - format
      - completeness
      - vendored_components
      - install_scripts
      properties:
        advisory_scan:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AdvisoryScanResponse'
            description: 'Whether an advisory feed was consulted for the vendored components, and

              how that went. `null` when the package vendors nothing.


              TOP-LEVEL AND NOT PART OF `completeness`, which is a different fact

              wearing the same word. `completeness` is ARCHIVE-read completeness: its

              `partial` means the unpacker could not read the whole package, and it

              drives a banner counting files read. This field''s `partial` means every

              component was found and a feed did not answer about them.


              Deriving one from the other fabricates whichever did not happen. A

              truncated archive would be relabelled an advisory-feed outage, and a

              feed outage on a fully-read package would render "only 40 of 40 files

              were read" — a banner that lies. Two failures, two fields.'
        analyzed_at:
          type:
          - string
          - 'null'
        completeness:
          $ref: '#/components/schemas/CompletenessResponse'
        format:
          type: string
        install_scripts:
