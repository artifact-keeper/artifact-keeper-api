  /api/v1/admin/downloads:
    get:
      tags:
      - admin
      summary: 'List attributed downloads (client IP + user), filterable by artifact,

        user, IP, and time range (#2365). Covers hosted artifact downloads and

        proxy pull-through serves alike, each row marked with its `source`

        (#4539). Admin-only: download attribution is sensitive.'
      operationId: list_downloads
      parameters:
      - name: artifact_id
        in: query
        description: Filter to downloads of one artifact.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: user_id
        in: query
        description: Filter to downloads by one user.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: ip
        in: query
        description: Filter to downloads from one client IP (exact match).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: from
        in: query
        description: Inclusive lower bound on `downloaded_at` (RFC 3339).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: to
        in: query
        description: Inclusive upper bound on `downloaded_at` (RFC 3339).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: source
        in: query
        description: 'Filter to one source: `hosted` (a hosted artifact) or `proxy` (a

          pull-through serve from a Remote repository). Omitted: both (#4539).'
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DownloadSource'
      - name: repository_id
        in: query
        description: 'Filter to downloads served from one repository: the artifact''s

          repository for a hosted download, the Remote repository for a proxy

          serve (#4539).'
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Attributed download events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadListResponse'
        '400':
          description: Invalid filter parameter
        '403':
          description: Admin privileges required
      security:
      - bearer_auth: []
