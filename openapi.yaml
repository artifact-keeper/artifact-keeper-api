        required: true
      responses:
        '200':
          description: Backup restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
        '400':
          description: Archive integrity could not be established, or an unsupported option was supplied
        '404':
          description: Backup not found
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
