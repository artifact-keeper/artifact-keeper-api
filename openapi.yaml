      description: 'Proxied content has no `artifacts` row (#1278), so the artifact-keyed

        release endpoint cannot act on it. This endpoint is keyed on the

        proxy-cache catalog''s `(repository, path)` identity (#3912): it clears

        the cache sidecar''s hold and stamps the catalog row''s release.'
      operationId: release_proxy_cache_entry
      parameters:
      - name: repo_key
        in: path
        description: Remote (proxy) repository key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseProxyCacheRequest'
        required: true
      responses:
        '200':
          description: Cached artifact released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyCacheReleaseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Repository or cached path not found
        '409':
          description: Cached artifact is not currently held
      security:
      - bearer_auth: []
