          - 'null'
          description: 'Custom User-Agent used for outbound HTTP requests to the upstream,

            read back from `repository_config`. `None` when unset.'
        debian:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DebianRepositoryConfig'
            description: 'Debian remote proxy filter (#2460), read back from `repository_config`.

              Omitted for non-Debian-remote repositories or when no filter is set.'
