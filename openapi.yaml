        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Per-prefix storage rollup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryStorageTreeResponse'
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
