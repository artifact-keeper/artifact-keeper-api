        description: Page number (1-indexed)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: status
        in: query
        description: Filter by status (pending, approved, rejected)
        required: false
        schema:
          type: string
      - name: source_repository
        in: query
        description: Filter by source repository key
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Approval history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
      security:
      - bearer_auth: []
  /api/v1/approval/pending:
    get:
      tags:
      - approval
      summary: List pending approval requests. Optionally filter by source repository.
      operationId: list_pending_approvals
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: source_repository
        in: query
        description: Filter by source repository key
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Pending approval requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
