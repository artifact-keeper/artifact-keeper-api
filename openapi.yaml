  /api/v1/repositories/{key}/allowlist:
    get:
      tags:
      - repositories
      summary: Get the package allowlist of a virtual conda repository
      operationId: get_conda_allowlist
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondaAllowlistResponse'
        '400':
          description: Repository is not a virtual conda repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
    put:
      tags:
      - repositories
      summary: Set the package allowlist of a virtual conda repository
      description: 'Restricts what the virtual''s REMOTE members contribute. When `enabled`,

        a remote package record is listed in the virtual''s `repodata.json` (every

        encoding) only if some entry admits it, `channeldata.json` keeps only

        admitted names, and a download through the virtual of a package the list

        does not admit is never served from a remote member (404, as the index

        implies). Hosted (local/staging) members are not filtered.


        An entry is `{"name": ..., "version": ..., "subdirs": [...]}`: `name` is an

        exact conda package name or a glob (`*`, `?`), case-insensitive; `version`

        is an optional conda version spec evaluated with conda ordering (`2.2.3`

        is exact, `2.2.*`, `>=2,<3`, `1.0|1.1`); a version that does not parse is

        not admitted by a constrained entry. `subdirs` optionally restricts the

        entry to platforms. A package is admitted when any entry admits it.


        `enabled` is required: an enabled empty list admits nothing from remotes;

        `enabled: false` keeps the entries but restores the unfiltered merge.

        Limits: 10,000 entries, names up to 128 bytes, version specs up to 256

        bytes, 32 subdirs per entry. Changes apply to the next request.'
      operationId: set_conda_allowlist
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CondaAllowlist'
        required: true
      responses:
        '200':
          description: Allowlist saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondaAllowlistResponse'
        '400':
          description: Invalid entry, too many entries, or not a virtual conda repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - repositories
      summary: Remove the package allowlist of a virtual conda repository
      operationId: delete_conda_allowlist
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Allowlist removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondaAllowlistResponse'
        '400':
          description: Repository is not a virtual conda repository
        '401':
          description: Authentication required
        '403':
          description: Repository admin required
        '404':
          description: Repository not found
      security:
      - bearer_auth: []
  /api/v1/repositories/{key}/artifacts:
    get:
      tags:
      - repositories
      summary: List artifacts in repository
      operationId: list_artifacts
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
