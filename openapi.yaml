      - repositories
      summary: 'Remove a PEP 708 `tracks` declaration, restoring local-precedence isolation

        for that project name (#1600).'
      operationId: delete_pypi_track
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name (PEP 503 normalized server-side)
        required: true
        schema:
          type: string
