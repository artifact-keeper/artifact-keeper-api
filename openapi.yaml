        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Labels retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactLabelsListResponse'
        '404':
          description: Artifact not found
      security:
      - bearer_auth: []
    put:
      tags:
      - artifact-labels
      summary: Set all labels on an artifact (replaces existing)
      operationId: set_artifact_labels
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetArtifactLabelsRequest'
        required: true
      responses:
        '200':
          description: Labels updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactLabelsListResponse'
        '404':
          description: Artifact not found
      security:
      - bearer_auth: []
  /api/v1/artifacts/{id}/labels/{label_key}:
    post:
      tags:
      - artifact-labels
      summary: Add or update a single label on an artifact
      operationId: add_artifact_label
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      - name: label_key
        in: path
        description: Label key to set
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddArtifactLabelRequest'
        required: true
      responses:
        '200':
          description: Label added/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactLabelResponse'
        '404':
          description: Artifact not found
      security:
      - bearer_auth: []
    delete:
      tags:
      - artifact-labels
      summary: Delete a label by key from an artifact
      operationId: delete_artifact_label
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      - name: label_key
        in: path
        description: Label key to remove
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Label removed
        '404':
          description: Artifact not found
      security:
      - bearer_auth: []
  /api/v1/artifacts/{id}/metadata:
    get:
      tags:
      - artifacts
      summary: Get artifact metadata by artifact ID
      operationId: get_artifact_metadata
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMetadataResponse'
        '404':
          description: Artifact or metadata not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/artifacts/{id}/package-analysis:
    get:
      tags:
      - artifacts
      summary: Get the package analysis for an artifact.
      description: 'Returns 404 when no analysis has been recorded, which the web client

        normalizes to a "not analyzed" state. That is deliberately distinct from a

        200 carrying `status: "not_read"`: the first means we never ran, the second

        means we ran and could not read the bytes.'
      operationId: get_package_analysis
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Analysis retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageAnalysisResponse'
        '401':
          description: Authentication required
        '403':
          description: Not permitted to read this artifact
        '404':
          description: Artifact not found, or not analyzed
      security:
      - bearer_auth: []
  /api/v1/artifacts/{id}/stats:
    get:
      tags:
      - artifacts
      summary: Get artifact download statistics
      operationId: get_artifact_stats
      parameters:
      - name: id
        in: path
        description: Artifact ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artifact download statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactStatsResponse'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/attestations/policy:
    get:
      tags:
      - attestations
      summary: Read the CEP-27 attestation trust policy.
      operationId: get_attestation_policy
      responses:
        '200':
          description: Attestation trust policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationPolicyResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/ci/token:
    post:
      tags:
      - auth
      summary: Exchange a CI-issued OIDC JWT for an Artifact Keeper access token.
      description: 'The JWT must be supplied in the `Authorization: Bearer <jwt>` header.

        The CI platform (GitLab / GitHub Actions / generic OIDC) must be

        pre-configured by an administrator via `POST /api/v1/admin/ci-oidc`.


        The request body is optional: with no body the provider is resolved from

        the assertion''s `iss` claim, so the JWT is the only thing a pipeline needs

        (#3548). Send `{"provider_id": "<uuid>"}` to name a provider explicitly.'
      operationId: exchange_ci_token
      requestBody:
        description: Optional. Omit the body entirely to resolve the provider from the assertion's iss claim; send provider_id
          only to override that.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiTokenRequest'
        required: true
      responses:
        '200':
          description: CI token exchange successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiTokenResponse'
        '400':
          description: Malformed body, provider_id disagrees with the assertion's iss, or the issuer matches several enabled
            providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid CI token or provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No enabled CI OIDC provider matches the assertion's issuer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login with credentials
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout current session
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logout successful, auth cookies cleared
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get current user info
      operationId: get_current_user
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh access token
      operationId: refresh_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/exchange:
    post:
      tags:
      - sso
      summary: Exchange a short-lived code for access and refresh tokens
      operationId: exchange_code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCodeRequest'
        required: true
      responses:
        '200':
          description: Token exchange successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeCodeResponse'
        '400':
          description: Invalid or expired exchange code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/ldap/{id}/login:
    post:
      tags:
      - sso
      summary: Authenticate via LDAP
      operationId: ldap_login
      parameters:
      - name: id
        in: path
        description: LDAP provider configuration ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapLoginRequest'
        required: true
      responses:
        '200':
          description: Authentication successful with tokens
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: LDAP provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/oidc/{id}/callback:
    get:
      tags:
      - sso
      summary: Handle OIDC authorization callback
      operationId: oidc_callback
      parameters:
      - name: id
        in: path
        description: OIDC provider configuration ID
        required: true
        schema:
          type: string
          format: uuid
      - name: code
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: state
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: error
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: error_description
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: error_uri
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '307':
          description: Redirect to frontend with exchange code, or to /callback?silent_denied=1 when a prompt=none probe found
            no IdP session
        '400':
          description: Invalid callback parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: IdP error or invalid/expired SSO state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/oidc/{id}/login:
    get:
      tags:
      - sso
      summary: Initiate OIDC login redirect
      operationId: oidc_login
      parameters:
      - name: id
        in: path
        description: OIDC provider configuration ID
        required: true
        schema:
          type: string
          format: uuid
      - name: prompt
        in: query
        description: 'Optional OIDC `prompt` value forwarded to the IdP''s authorization

          endpoint. Only `none` is accepted (silent check-sso): the web UI uses

          it to probe for an existing IdP session without ever rendering the

          IdP''s login page. Any other value is rejected so the login redirect

          cannot be steered into unexpected IdP behaviours.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '307':
          description: Redirect to OIDC authorization endpoint
        '400':
          description: Unsupported prompt value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OIDC provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/providers:
    get:
      tags:
      - sso
      summary: List all enabled SSO providers
      operationId: list_providers
      responses:
        '200':
          description: List of enabled SSO providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SsoProviderInfo'
  /api/v1/auth/sso/saml/{id}/acs:
    post:
      tags:
      - sso
      summary: Handle SAML Assertion Consumer Service (ACS) callback
      operationId: saml_acs
      parameters:
      - name: id
        in: path
        description: SAML provider configuration ID (UUID) or slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SamlAcsForm'
        required: true
      responses:
        '307':
          description: Redirect to frontend with exchange code
        '400':
          description: Invalid SAML response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sso/saml/{id}/login:
    get:
      tags:
      - sso
      summary: Initiate SAML login redirect
      operationId: saml_login
      parameters:
      - name: id
        in: path
        description: SAML provider configuration ID (UUID) or slug
        required: true
        schema:
          type: string
      responses:
        '307':
          description: Redirect to SAML IdP SSO endpoint
        '404':
          description: SAML provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/ticket:
    post:
      tags:
      - auth
      summary: 'Create a short-lived, single-use download/stream ticket for the current user.

        The ticket can be passed as a `?ticket=` query parameter on endpoints that

        cannot use `Authorization` headers (e.g. `<a>` downloads, `EventSource` SSE).'
      description: 'Security note: the resulting ticket value will appear in webserver access

        logs, browser history, and `Referer` headers if it is embedded in a URL.

        The mitigation is single-use consumption plus a 30-second TTL plus 256-bit

        entropy. Clients should consume the ticket immediately and never share or

        log the URL that contains it.'
      operationId: create_download_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
        required: true
      responses:
        '200':
          description: Download ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid resource_path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The token lacks read:artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/tokens:
    post:
      tags:
      - auth
      summary: Create a new API token for the current user
      operationId: create_api_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
        required: true
      responses:
        '200':
          description: API token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiTokenResponse'
        '400':
          description: Unknown field, invalid scope, or a repo_selector that does not restrict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A scope or repo_selector exceeds what the presenting credential may delegate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/tokens/{token_id}:
    delete:
      tags:
      - auth
      summary: Revoke an API token
      operationId: revoke_api_token
      parameters:
      - name: token_id
        in: path
        description: ID of the API token to revoke
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: API token revoked
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/totp/disable:
    post:
      tags:
      - auth
      summary: Disable TOTP for the authenticated user (requires password and current TOTP code)
      operationId: disable_totp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
        required: true
      responses:
        '200':
          description: TOTP disabled successfully
        '401':
          description: Invalid password or TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The 2FA enforcement policy requires TOTP for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/totp/enable:
    post:
      tags:
      - auth
      summary: Enable TOTP by verifying the initial code and generating backup codes
      operationId: enable_totp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      responses:
        '200':
          description: TOTP enabled with backup codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnableResponse'
        '401':
          description: Unauthorized or invalid TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/totp/enroll/complete:
    post:
      tags:
      - auth
      summary: Complete policy-required TOTP enrollment and receive a session.
      operationId: enroll_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollCompleteRequest'
        required: true
      responses:
        '200':
          description: TOTP enrolled; session and backup codes returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollCompleteResponse'
        '400':
          description: TOTP is already enabled, or /enroll/setup was not called first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid code, or invalid/expired/already-used enrollment ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/totp/enroll/setup:
    post:
      tags:
      - auth
      summary: Begin policy-required TOTP enrollment using a login-issued enrollment ticket.
      operationId: enroll_setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollSetupRequest'
        required: true
      responses:
        '200':
          description: TOTP secret and QR code URL for enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
        '400':
          description: TOTP is already enabled for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired enrollment ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/totp/setup:
    post:
      tags:
      - auth
      summary: Generate a new TOTP secret and QR code URL for the authenticated user
      operationId: setup_totp
      responses:
        '200':
          description: TOTP setup details with secret and QR code URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
  /api/v1/auth/totp/verify:
    post:
