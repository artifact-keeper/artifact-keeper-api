      - succeeded
      properties:
        repository:
          type: string
          description: The repository key the sync was triggered for.
        succeeded:
          type: boolean
          description: 'Whether the sync pass completed without error. A false value with

            `triggered = true` means the pass ran but an upstream fetch/verify step

            failed for the repo (details are in the server logs, not this response).'
        triggered:
          type: boolean
          description: Always true when the trigger was accepted and a sync pass ran.
    SystemConfigResponse:
      type: object
      description: "Runtime configuration values.\n\nThis response intentionally omits all secrets, credentials, and internal\n\
        connection strings.\n\nDisclosure is tiered (see `get_system_config`):\n\n* **Public-safe fields** are always present\
        \ — they only describe UI/client\n  affordances a caller needs *before* authenticating (upload limit, demo\n  mode,\
        \ whether guest access and which login providers are available).\n* **Security-posture fields** (`scanners`, `search_engine`,\n\
        \  `storage_backend`, `permissions`, `plugin_signing`, and\n  `auth.admin_break_glass_enabled`) describe the instance's\
        \ defensive\n  configuration. They are returned **only to authenticated admins** and are\n  omitted for anonymous\
        \ / non-admin callers, so the deployment's security\n  posture cannot be fingerprinted by an unauthenticated attacker."
      required:
      - max_upload_size_bytes
      - demo_mode
      - guest_access_enabled
      - auth
      properties:
        auth:
          $ref: '#/components/schemas/AuthConfig'
          description: 'Authentication provider availability. Needed by the login UI before the

            user authenticates, so this is public-safe.'
        demo_mode:
          type: boolean
          description: Whether the instance is running in demo mode (writes blocked).
        guest_access_enabled:
          type: boolean
          description: 'Whether anonymous (unauthenticated) access is permitted at all (issue #850).

            When `false`, the server rejects all unauthenticated requests except for

            the login, setup, health, and OCI challenge endpoints. Frontends should

            hide UI affordances that imply public access (e.g. the "public repo"

            toggle) and redirect unauthenticated users to the login page.'
        max_upload_size_bytes:
          type: integer
          format: int64
          description: Maximum upload size in bytes (0 means no limit).
          minimum: 0
        oidc_issuer:
          type:
          - string
          - 'null'
          description: 'OIDC issuer URL, if configured. This is public information needed by

            clients to initiate the OIDC flow.'
        permissions:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PermissionsConfig'
            description: 'Fine-grained permissions enforcement status. Permission rules can be

              managed via /api/v1/permissions and are actively enforced.

              Admin-only (security posture).'
        plugin_signing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PluginSigningConfig'
            description: 'Plugin signature-verification (supply-chain) policy status.

              Admin-only (security posture).'
        scanners:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ScannersConfig'
            description: Scanner availability. Admin-only (security posture).
        search_engine:
          type:
          - string
          - 'null'
          description: 'Search engine type: "opensearch" when configured, "database" otherwise.

            Admin-only (security posture).'
        storage_backend:
          type:
          - string
          - 'null'
          description: 'Storage backend type (e.g. "filesystem", "s3", "gcs", "azure").

            Admin-only (security posture).'
    SystemSettings:
      type: object
      required:
      - storage_backend
      - storage_path
      - allow_anonymous_download
      - max_upload_size_bytes
      - retention_days
      - audit_retention_days
