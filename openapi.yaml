          format: int64
        artifacts_start:
          type: integer
          format: int64
        downloads_in_period:
          type: integer
          format: int64
        period_end:
          type: string
          format: date
        period_start:
          type: string
          format: date
        storage_bytes_end:
          type: integer
          format: int64
        storage_bytes_start:
          type: integer
          format: int64
        storage_growth_bytes:
          type: integer
          format: int64
        storage_growth_percent:
          type: number
          format: double
