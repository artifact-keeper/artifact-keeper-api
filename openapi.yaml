          description: 'Number of artifacts whose latest scan had no inventory rows and

            for which a rescan was enqueued in this call.'
        limit:
          type: integer
          format: int64
          description: 'Echo of the requested (or defaulted) limit, useful for clients

            driving the loop programmatically.'
