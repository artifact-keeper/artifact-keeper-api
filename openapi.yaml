    UpdatePolicyRequest:
      type: object
      description: 'Partial-update payload for `PUT /security/policies/{id}`.


        Every field is `Option<T>` so clients can send any subset of mutable

        columns; omitted fields leave the existing row value untouched. The

        previous shape required all of `name`, `max_severity`, `block_unscanned`,

        `block_on_fail`, `is_enabled` on every call. That was incompatible with

        the release-gate `scan-policy-crud` test (and external callers) which

        PATCH a subset like `{max_severity, is_enabled}`; under the strict shape

        the request was rejected as a 422 and the boolean toggle silently never

        took effect on a follow-up GET. See #1374.


        For `min_staging_hours` / `max_artifact_age_days` the field is the inner

        nullable `i32`; "not provided" leaves the column untouched. Explicit

        `null` to clear those columns is not currently supported; the release

        gate only mutates the bool/enum fields, so the narrower semantics are

        sufficient and we avoid an ambiguous JSON contract.'
      properties:
        block_on_fail:
          type:
          - boolean
          - 'null'
        block_unscanned:
          type:
          - boolean
          - 'null'
        is_enabled:
          type:
          - boolean
          - 'null'
        max_artifact_age_days:
          type:
          - integer
          - 'null'
          format: int32
        max_severity:
          type:
          - string
          - 'null'
        min_staging_hours:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type:
          - string
          - 'null'
        predicates:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PolicyPredicates'
            description: '#4058: omitted leaves the stored predicate document untouched; sending

              a document replaces it wholesale (a document is one unit of truth, not

              a set of independently patchable fields).'
        require_signature:
          type:
          - boolean
          - 'null'
    UpdateProjectRequest:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Global admin only: a project admin sending this field gets 403.'
    UpdateRepositoryRequest:
      type: object
      required:
      - curation_default_action
      properties:
        allow_anonymous_access:
          type:
          - boolean
          - 'null'
          description: 'Alias for `is_public`. When set to true, anonymous users can download

            artifacts without authentication. Useful for remote (pull-through cache)

            repositories that proxy public upstream registries. Write operations

            (upload, delete) still require authentication regardless of this setting.

            If both `is_public` and `allow_anonymous_access` are provided,

            `allow_anonymous_access` takes precedence.'
          deprecated: true
        apt_description:
          type:
          - string
          - 'null'
          description: 'Custom Description field for Debian/APT Release files. Pass an empty

            string to remove (omits the field entirely from the Release file).

            Stored in `repository_config` under `apt_description`.'
        apt_label:
          type:
          - string
          - 'null'
          description: 'Custom Label field for Debian/APT Release files. Pass an empty string

            to reset to the default ("artifact-keeper").

            Stored in `repository_config` under `apt_label`.'
        apt_origin:
          type:
          - string
          - 'null'
          description: 'Custom Origin field for Debian/APT Release files. Pass an empty string

            to reset to the default ("artifact-keeper").

            Stored in `repository_config` under `apt_origin`.'
        apt_release_version:
          type:
          - string
          - 'null'
          description: 'Custom Version field for Debian/APT Release files. Pass an empty

            string to remove (omits the field entirely from the Release file).

            Stored in `repository_config` under `apt_release_version`.'
        curation_allow_unverified:
          type:
          - boolean
          - 'null'
          description: 'Update the keyless-sync unverified-ingest opt-in (#2569). When provided,

            sets `curation_allow_unverified` (`false` restores the fail-closed

            default; `true` opts into legacy unverified ingest). Omit to leave it

            unchanged.'
        curation_default_action:
          type: string
          description: 'Default curation action when no rule matches: allow or review.

            "block" is rejected (DB CHECK, migration 071); use block rules for

            specific packages instead.


            The allowed set is spelled out in the schema so a generated SDK presents it

            rather than an unconstrained string.'
          example: allow
        curation_enabled:
          type:
          - boolean
          - 'null'
          description: Enable curation-rule enforcement on this repository's proxy paths.
        custom_user_agent:
          type:
          - string
          - 'null'
          description: 'Update the custom User-Agent for outbound HTTP requests to the upstream.

            Only valid for remote repositories. Pass an empty string to remove.

            Max 256 characters. Stored in `repository_config` under `custom_user_agent`.'
        debian:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DebianConfigPatch'
            description: 'Update the Debian remote proxy filter (#2460). Three-way semantics:

              omit the field to leave the stored config unchanged; send `null` to

              clear it (revert to full-proxy); send an object to merge a partial

              update onto the stored config. Only valid for Debian Remote repos.'
        description:
          type:
          - string
          - 'null'
        index_upstream_url:
          type:
          - string
          - 'null'
          description: 'Update the Cargo index upstream URL (stored in `repository_config`).

            When provided, upserts the `index_upstream_url` key for this repository.'
        is_public:
          type:
          - boolean
          - 'null'
          deprecated: true
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        npm_allow_unscoped:
          type:
          - boolean
          - 'null'
          description: 'Update whether unscoped npm package names may resolve through this npm

            Remote repository (#2424). Stored under `npm_allow_unscoped`.'
        npm_allowed_name_patterns:
          type:
          - array
          - 'null'
