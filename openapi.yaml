          format: date-time
    SyncTaskResponse:
      type: object
      required:
      - id
      - artifact_id
      - storage_key
      - artifact_size
      - priority
      - status
      - created_at
      properties:
        artifact_id:
          type: string
          format: uuid
        artifact_size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          description: 'When the task was enqueued. Lets clients tell a freshly-scheduled task

            apart from a stale queue entry (used by the replication-schedule check).

            Serialized as whole-second RFC3339 with a `Z` suffix

            (e.g. `2026-05-29T12:34:56Z`) so simple ISO8601 parsers can consume it.'
        id:
          type: string
          format: uuid
        priority:
          type: integer
          format: int32
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the worker began transferring, if it has started. Same format as

            `created_at`.'
        status:
          type: string
          description: Task status (e.g. "pending"). Listing currently returns pending tasks.
        storage_key:
          type: string
    SyncTriggerResponse:
      type: object
      required:
