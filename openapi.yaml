    delete:
      tags:
      - admin
      summary: Delete a backup
      operationId: delete_backup
      parameters:
      - name: id
        in: path
        description: Backup ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Backup deleted
        '404':
          description: Backup not found
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}/cancel:
    post:
      tags:
      - admin
      summary: Cancel a running backup
      operationId: cancel_backup
      parameters:
      - name: id
        in: path
        description: Backup ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Backup cancelled
        '404':
          description: Backup not found
        '409':
          description: Backup is not in a cancellable state
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}/execute:
    post:
      tags:
      - admin
      summary: Execute a pending backup
      description: 'Answers with the backup resource as persisted after the run. A run that

        FAILED is reported as `status = "failed"` with `error_message` naming the

        cause — it is not a transport-level error, because the request was

        understood and carried out and the outcome belongs to the backup (#3327).

        Clients must read `status`, not just the HTTP code. `500` is reserved for

        the cases where no run outcome exists to report at all.'
      operationId: execute_backup
      parameters:
      - name: id
        in: path
        description: Backup ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Backup run finished; `status` is `completed` or `failed` and `error_message` carries the cause of a
            failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'
        '404':
          description: Backup not found
        '409':
          description: Another backup is already in progress
        '500':
          description: The run could not be started or its outcome could not be recorded
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}/restore:
    post:
      tags:
      - admin
      summary: Restore from backup
      operationId: restore_backup
      parameters:
      - name: id
        in: path
        description: Backup ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
