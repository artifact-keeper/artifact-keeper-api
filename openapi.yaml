          - 'null'
        artifact_version:
          type:
          - string
          - 'null'
        collapsed_not_applicable_count:
          type:
          - integer
          - 'null'
          format: int32
          description: '#2471: number of `not_applicable` scanner rows folded into this row.

            `Some(n)` marks a synthetic *summary* row that collapses `n` redundant

            "this scanner does not apply" results (e.g. the image-family scanners

            `filesystem`/`incus`/`openscap` all declining on a Docker image) into a

            single muted "not applicable to this artifact" indication, so the UI

            stops rendering N rows that read as N failures. `None` for every real

            (non-collapsed) scan row. Omitted from the wire when `None`.'
        collapsed_scan_types:
          type:
          - array
          - 'null'
          items:
            type: string
          description: '#2471: the individual `scan_type` values folded into a summary row,

            sorted and de-duplicated (e.g. `["filesystem","incus","openscap"]`).

            Present only on a synthetic summary row (alongside

            `collapsed_not_applicable_count`); `None` / omitted otherwise.'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        critical_count:
          type: integer
          format: int32
        error_message:
          type:
          - string
          - 'null'
        findings_count:
          type: integer
          format: int32
        high_count:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        info_count:
          type: integer
          format: int32
        is_reused:
          type: boolean
          description: 'True when the row was synthesized by the dedup path (`copy_scan_results`)

            because a prior scan with the same `(checksum_sha256, scan_type)` pair

            already existed within the dedup TTL. No scanner was actually invoked

            for this row; counts and findings were copied from `source_scan_id`.'
        low_count:
          type: integer
          format: int32
        medium_count:
          type: integer
          format: int32
        repository_id:
          type: string
          format: uuid
        scan_completeness:
          type: string
          description: '`complete`, `partial` or `not_cataloged` (#4154). A `not_cataloged`

            scan graded nothing; it sets the repository''s `has_uncataloged_scan`

            (and floors its grade letter for package artifacts). A `partial` scan

            graded less than the whole artifact.'
        scan_completeness_reason:
          type:
          - string
          - 'null'
          description: 'Why the scan is not `complete`, when known (e.g. which scanner

            cataloged nothing). `None` for complete scans.'
        scan_type:
          type: string
        scanner_version:
          type:
          - string
          - 'null'
        source_scan_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'When `is_reused` is true, the `id` of the source scan whose results

            were copied. Useful for distinguishing "fresh scan" from "deduped

            satisfaction" in release-gate provenance checks. None for original

            (non-reused) scans.'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
        vuln_db_published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When that database was built / last updated (#3014); for a live-API

            scanner, the query time. `null` means unknown, never fresh.'
        vuln_db_version:
          type:
          - string
          - 'null'
          description: 'Vulnerability database the scan ran against (#3014), distinct from

            `scanner_version` (the binary): e.g. `trivy-db-v2`, `grype-db-v6.1.10`,

            or `live:osv` / `live:osv+ghsa` for the dependency scanner, which

            queries live advisory APIs. `null` when the scan type has no database

            or the scan predates this field. A reused scan reports its source''s.'
          example: grype-db-v6.1.10
    ScannersConfig:
