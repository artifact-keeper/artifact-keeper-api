        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artifact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/artifacts/{id}/labels:
    get:
      tags:
      - artifact-labels
      summary: List all labels on an artifact
      operationId: list_artifact_labels
      parameters:
      - name: id
