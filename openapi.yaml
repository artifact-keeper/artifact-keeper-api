        repository_key:
          type: string
    CondaPolicyPredicates:
      type: object
      description: "Conda-specific policy predicates over the facts the #4033 content epic\npersists (#4058).\n\nEvery field\
        \ is optional in effect: empty lists and unset options mean the\npredicate is not enforced. Lists are the organisation's\
        \ own allow/deny\nvalues — the product ships the mechanism, never a seeded list.\n\nFact sources:\n\n* `allowed_channels`\
        \ / `denied_channels` — the channel of origin recorded\n  in the artifact's conda identity purl at ingest (a remote\
        \ repo's upstream\n  URL, or the owning repository's key for a hosted upload), falling back to\n  the owning repository's\
        \ key when no identity was recorded.\n* `denied_licenses` / `denied_license_families` — the `license` /\n  `license_family`\
        \ keys `build_conda_metadata` persists from `about.json`.\n* `block_install_scripts` / `max_install_script_severity`\
        \ — the\n  `package_install_scripts` rows and their `findings` JSON (migration 222).\n* `min_attestation_state` —\
        \ the CEP-27 verification record on\n  `curation_packages.attestation_state` (`absent` = no record,\n  `present` =\
        \ a record that is unverified or failed, `verified`)."
      properties:
        allowed_channels:
          type: array
          items:
            type: string
          description: 'Non-empty: the artifact''s channel of origin must be in this set. An

            artifact whose origin is unknown fails closed (the predicate exists to

            prove origin, and an unknown origin proves nothing).'
          default: []
        block_install_scripts:
          type: boolean
          description: 'Block any package that carries install-time scripts (post-link /

            pre-link / pre-unlink), regardless of what analysis found in them.'
          default: false
        denied_channels:
          type: array
          items:
            type: string
          description: The artifact's channel of origin must not be in this set.
          default: []
        denied_license_families:
          type: array
          items:
            type: string
          description: 'License families (the conda `license_family` coarse grouping, e.g.

            `GPL`, `MIT`, `BSD`, `Apache`) that must not appear. Case-insensitive.'
          default: []
        denied_licenses:
          type: array
          items:
            type: string
          description: 'SPDX-style license tokens that must not appear as the artifact''s

            declared `license`. Matching is case-insensitive. An undeclared license

            is not a denied license.'
          default: []
        max_install_script_severity:
          type:
          - string
          - 'null'
          description: 'Block when any install-script analysis finding is at or above this

            severity (`info` / `low` / `medium` / `high`, matching the

            `ScriptSeverity` the analyzer persists). Scripts the rule engine could

            not examine (`findings IS NULL`) are not graded by this gate — the

            presence predicate above covers them; grading them would conflate

            "unexamined" with "clean".'
          default: null
        min_attestation_state:
          type:
          - string
          - 'null'
          description: '`present`: a publish attestation must exist for this package (any

            verification state). `verified`: the attestation must additionally

            have passed verification. Unset: attestation is not required.'
          default: null
