  /api/v1/repositories/{key}/security/proxy-scans/rescan:
    post:
      tags:
      - security
      summary: 'Rescan bytes already in the proxy cache, recording the verdict, package

        inventory and per-CVE detail exactly as an inline gated pull would (#3396).'
      operationId: rescan_proxy_cached_path
      parameters:
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRescanRequest'
        required: true
      responses:
        '200':
          description: Rescan completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRescanResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository or path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cached object is above the inline scan cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Rescan cooldown in effect: `RESCAN_THROTTLED`, with `Retry-After` naming the remaining cooldown in
            whole seconds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Rescan could not produce a verdict: `NO_SCANNER_CONFIGURED` (no scanner is configured for this instance),
            `RESCAN_SCAN_FAILED` (the scan ran and errored), or `RESCAN_BUDGET_EXCEEDED` (the scan did not finish inside its
            budget). `Retry-After` is set only when cooldown time actually remains. The stored verdict is unchanged in every
            case.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
