    DockerTagResponse:
      type: object
      description: 'A Docker/OCI tag grouped by (image, tag).


        `total_size_bytes` is the server-side aggregation of the manifest body

        plus every referenced layer blob.  This is what the UI should display

        as the on-disk image size; the previous client-side aggregation that

        only summed the manifest body itself reported a few kilobytes for

        images that are hundreds of megabytes on disk (artifact-keeper#1193).


        For multi-arch image indexes the size is the sum across all per-arch

        child manifests recorded in `oci_manifest_refs`, so an `amd64+arm64`

        index reports the combined storage cost.'
      required:
      - id
      - repository_key
      - image
      - tag
      - manifest_digest
      - total_size_bytes
      - layer_count
      - is_index
      - last_pushed_at
      properties:
        id:
          type: string
          format: uuid
          description: Representative manifest artifact ID.
        image:
          type: string
          description: 'Image name (no registry host, no tag).  Maps to the OCI v2 `<name>`

            path segment, which may include slashes (e.g. `library/postgres`).'
        is_index:
          type: boolean
          description: Whether this manifest is a multi-arch image index.
        last_pushed_at:
          type: string
          format: date-time
          description: Last push (or update) timestamp from the underlying `oci_tags` row.
        layer_count:
          type: integer
          format: int32
          description: 'Number of layer blobs referenced by the manifest.  For image indexes

            this is the sum of layer counts across child manifests.  `0` when

            the manifest could not be parsed.'
        manifest_digest:
          type: string
          description: Manifest content digest (e.g. `sha256:abcdef...`).
        repository_key:
          type: string
          description: Repository key this tag belongs to.
        scan_status:
          type:
          - string
          - 'null'
          description: "Rolled-up scan status across all scanners configured for this\nartifact. `None` when the artifact\
            \ has never been scanned.\n\nValues surface the aggregate state, not a single scanner's row\n(see #1497). One\
            \ of:\n\n* `pending` / `running` -- at least one scanner is still in flight\n* `completed` -- every per-scan-type\
            \ latest row is `completed`\n* `failed` -- every per-scan-type latest row is `failed`\n* `partial` -- mixed: at\
            \ least one `completed` AND at least one\n  `failed`. A green generic scanner (e.g. grype) no longer hides\n \
            \ a failed format-native scanner (e.g. incus) behind a\n  `completed` label."
        tag:
          type: string
          description: 'Tag string (e.g. `16-alpine`).  Never a `sha256:...` digest;

            digest-only references are filtered out of the grouping.'
        total_size_bytes:
          type: integer
          format: int64
          description: 'Total size in bytes of the manifest plus all referenced layer blobs.

            For image indexes, this sums across child manifests.'
