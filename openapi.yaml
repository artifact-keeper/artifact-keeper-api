      type: object
      description: One repository's before/after in a ledger backfill (#3650).
      required:
      - repository_id
      - repository_key
      - after_total_bytes
      - after_hosted_bytes
      - after_proxy_bytes
      - after_oci_bytes
      - drift_bytes
      properties:
        after_hosted_bytes:
          type: integer
          format: int64
          description: '`artifacts` bytes, excluding soft-deleted rows and legacy

            `proxy-cache/%` keys — migration 182''s `hosted_bytes` rule verbatim.'
        after_oci_bytes:
          type: integer
          format: int64
          description: '`oci_blobs` bytes (every row counts; a `pending_delete_at` marker is

            not a deletion and does not change the figure).'
        after_proxy_bytes:
          type: integer
          format: int64
          description: '`proxy_cache_artifacts` bytes (every row counts). A breakdown of

            `after_total_bytes`, not a disjoint bucket.'
        after_total_bytes:
          type: integer
          format: int64
          description: 'Ledger total after the backfill: `hosted + proxy + oci`, the same sum

            `/admin/stats.total_storage_bytes` aggregates.'
        before_total_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Ledger total before the backfill, or `null` when the repository had no

            ledger row at all. A database restored from backup is the `null` case:

            the restore inserts `artifacts` / `oci_blobs` / `proxy_cache_artifacts`

            rows without firing migration 182''s triggers, so no ledger row is ever

            written for them.'
        drift_bytes:
          type: integer
          format: int64
          description: '`after_total_bytes - before_total_bytes`, counting a missing row as 0.'
        repository_id:
          type: string
          format: uuid
        repository_key:
          type: string
