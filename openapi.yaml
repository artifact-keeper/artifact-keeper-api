    NpmUpstreamFeedStatus:
      type: object
      description: 'Admin view of the npm upstream change-feed (#3069), served by

        `GET /api/v1/admin/npm/upstream-feed/status`.


        Mixed scope: `consumer_running`, `is_leader` and `last_error` describe

        only the replica named by `replica_id` (the one that answered this call);

        `enabled`/`feed_url` are that replica''s effective configuration; `cursor`,

        `last_poll_at` and `cluster_leader_active` are cluster-wide (read from the

        shared database). Behind a load balancer, repeated calls may be answered

        by different replicas.'
      required:
      - replica_id
      - enabled
      - feed_url
      - consumer_running
      - is_leader
      - cluster_leader_active
      - leader_term_secs
      properties:
        cluster_leader_active:
          type: boolean
          description: 'Whether ANY replica currently holds the feed''s advisory lock (read from

            `pg_locks`), i.e. whether the feed is being consumed cluster-wide.'
        consumer_running:
          type: boolean
          description: 'Whether a consumer task runs on THE REPLICA THAT ANSWERED. `false` when

            the feed is disabled, the packument cache is off, or the URL was

            rejected (`last_error` then says why).'
        cursor:
          type:
          - string
          - 'null'
          description: 'Last persisted feed sequence (`upstream_feed_state.last_seq`); `null`

            before the consumer has ever bootstrapped.'
        enabled:
          type: boolean
          description: Effective `NPM_UPSTREAM_FEED_ENABLED`.
        feed_url:
          type: string
          description: 'Effective `NPM_UPSTREAM_FEED_URL`, with userinfo and query string

            removed (a placeholder when the value does not parse).'
        is_leader:
          type: boolean
          description: 'Whether THE REPLICA THAT ANSWERED holds the feed''s advisory lock. Behind

            a load balancer this is usually `false` on a healthy cluster; read

            `cluster_leader_active` for "is anyone consuming".'
        last_error:
          type:
          - string
          - 'null'
          description: 'Most recent feed failure seen by the replica that answered (poll,

            bootstrap, cursor read, or invalidation actions) during its current

            leadership term, cleared once a poll and its actions succeed and when

            the replica steps down. Only the leader polls, so a non-leader replica

            reports `null` here unless it failed to start the consumer.'
        last_poll_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the cursor was last persisted (`upstream_feed_state.updated_at`).

            The consumer only writes when the cursor moves, so on a quiet feed

            this trails the most recent poll.'
        leader_term_secs:
          type: integer
          format: int64
          description: 'Leadership term length: a leader steps down and re-contends at most

            this often, which bounds failover after a silently lost lock.'
          minimum: 0
        replica_id:
          type: string
          description: 'Which replica answered, as `<host>:<pid>:<boot-uuid>` (`<host>` is

            `POD_NAME`, else `HOSTNAME`). The per-replica fields below

            (`consumer_running`, `is_leader`, `last_error`) describe this replica

            only.'
    OciBlobFootprintReport:
      type: object
      description: 'Read-only OCI blob storage footprint report (issue #1408).


        This is a **reporting-only** view. It performs no deletion and takes no

        locks. It surfaces how much storage the tracked `oci_blobs` rows

        account for so operators can see the magnitude of un-reclaimed blob

        layers before any garbage-collection mechanism is enabled.


        It deliberately does NOT attempt to classify which blobs are

        "reclaimable orphans": that is the blob GC''s job (mark-and-sweep over

        `manifest_blob_refs`, per [`BLOB_PROTECTED_BY_REFS_SQL`]). A naive

        per-`(repository_id, digest)` orphan heuristic would mis-handle shared

        backends (anything other than `filesystem`), where all referencing

        repos share ONE physical object per digest per backend, and report

        in-use blobs as reclaimable; on `filesystem` each repository keeps an

        independent copy under its own `storage_path`. The numbers here are

        exact aggregates only.'
      required:
      - total_blob_rows
      - distinct_digests
      - logical_bytes
      - physical_bytes
      - grace_hours
      - aged_distinct_digests
      - aged_physical_bytes
      - per_repository
      properties:
        aged_distinct_digests:
          type: integer
          format: int64
          description: 'Distinct digests with at least one physical copy older than

            `grace_hours` (eligible to be *considered* by a future GC sweep once

            a reference table exists). Reporting only.'
        aged_physical_bytes:
          type: integer
          format: int64
          description: 'Physical bytes (same physical-object grouping as `physical_bytes`)

            older than `grace_hours`.'
        distinct_digests:
          type: integer
          format: int64
          description: 'Number of distinct blob digests (content-addressed identities). When

            this is smaller than `total_blob_rows`, the difference is cross-repo

            sharing of a content identity (one physical object shared by all

            referencing repos on shared backends; an independent copy per

            repository on `filesystem`).'
        grace_hours:
          type: integer
          format: int64
          description: Grace window (hours) applied to the `aged_*` figures below.
        logical_bytes:
          type: integer
          format: int64
          description: 'Sum of `size_bytes` over every `oci_blobs` row. Double-counts

            deduplicated blobs once per referencing repository.'
        per_repository:
          type: array
          items:
            $ref: '#/components/schemas/OciBlobRepoFootprint'
          description: Per-repository logical footprint, largest `logical_bytes` first.
        physical_bytes:
          type: integer
          format: int64
          description: 'Sum of `size_bytes` counting each distinct **physical storage

            object** exactly once, per the ownership model of

            [`BLOB_PROTECTED_BY_REFS_SQL`]: on shared backends (anything other

            than `filesystem`) a digest is one object per backend; on

            `filesystem` each repository stores its own copy under its

            `storage_path`, so the same digest in two filesystem repositories

            counts twice.'
        total_blob_rows:
          type: integer
          format: int64
          description: Total number of `oci_blobs` rows across all repositories.
    OciBlobRepoFootprint:
      type: object
      description: Per-repository row in the OCI blob footprint report.
      required:
      - repository_id
      - blob_rows
      - logical_bytes
      properties:
        blob_rows:
          type: integer
          format: int64
          description: Number of `oci_blobs` rows attributed to this repository.
        logical_bytes:
          type: integer
          format: int64
          description: 'Sum of `oci_blobs.size_bytes` for this repository''s rows. On shared

            backends (anything other than `filesystem`) blobs are deduplicated

            across repos — one physical object per digest per backend — so the

            same physical bytes can be counted under more than one repository

            here. On `filesystem` each repository stores its own independent

            copy under its `storage_path`, so its rows are that repo''s real

            bytes. See [`OciBlobFootprintReport::physical_bytes`] for the

            dedup-aware total.'
        repository_id:
          type: string
          format: uuid
          description: Repository id owning these `oci_blobs` rows.
    OidcConfigResponse:
