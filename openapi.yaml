      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      - name: project
        in: path
        description: Project name (PEP 503 normalized server-side)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PypiTrackRequest'
        required: true
