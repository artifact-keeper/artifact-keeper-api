    EgressProxyRequest:
      type: object
      description: 'Per-repository egress proxy settings (#2469, #2811).


        `proxy_url` is **write-only**: it is encrypted at rest and never returned.

        [`EgressProxyResponse`] echoes a redacted form (`http://***@proxy:3128`)

        so an operator can confirm the host and port without recovering the

        credentials, exactly as `upstream_auth_configured` does for upstream

        credentials.'
      required:
      - mode
      properties:
        mode:
          type: string
          description: '`inherit` (follow the process `HTTP_PROXY`/`HTTPS_PROXY`/`NO_PROXY`

            environment — the default), `direct` (never proxy this repository, even

            when the environment sets one), or `explicit` (use `proxy_url`, ignoring

            the environment entirely).'
        no_proxy:
          type:
          - string
          - 'null'
          description: 'Comma-separated hosts / domain suffixes / CIDRs that bypass the proxy

            for this repository. Only meaningful when `mode` is `explicit`.'
        proxy_url:
          type:
          - string
          - 'null'
          description: 'Proxy endpoint, `scheme://host[:port]`, http or https. May embed

            `user:pass@` credentials. Required when `mode` is `explicit`.

            Write-only, never returned in responses.'
    EgressProxyResponse:
      type: object
      description: Read-back of a repository's egress-proxy settings. Carries no secret.
      required:
      - mode
      - proxy_credentials_configured
      properties:
        mode:
          type: string
          description: '`inherit`, `direct` or `explicit`.'
        no_proxy:
          type:
          - string
          - 'null'
          description: The configured bypass list, if any.
        proxy_credentials_configured:
          type: boolean
          description: 'Whether the configured proxy URL carries credentials. The credentials

            themselves are never returned.'
        proxy_url:
          type:
          - string
          - 'null'
          description: 'The configured proxy with any credentials replaced by `***`. `None`

            unless `mode` is `explicit`.'
