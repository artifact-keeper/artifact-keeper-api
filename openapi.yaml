    UpdateVirtualMembersRequest:
      type: object
      description: 'Full-set replace of a virtual repository''s members (PR #2795, issue #2785;

        ratified in issue #2899).


        This body is the COMPLETE desired member list, not a partial patch. Any

        current member whose key is absent from `members` is removed; keys present

        are inserted or have their priority updated. An empty `members` array

        removes every member.


        WARNING: sending a partial list to reorder priorities deletes the omitted

        members. Clients must always send the full member list.'
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/VirtualMemberPriority'
          description: The complete desired member set. Members not listed here are removed.
    UpsertLicensePolicyRequest:
      type: object
      required:
      - name
      - allowed_licenses
      - denied_licenses
      properties:
        action:
          type: string
        allow_unknown:
          type: boolean
        allowed_licenses:
          type: array
          items:
            type: string
        denied_licenses:
          type: array
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        is_enabled:
          type: boolean
        name:
          type: string
        repository_id:
          type:
          - string
          - 'null'
          format: uuid
    UpsertScanConfigRequest:
      type: object
      description: 'Request to create or update a scan configuration.


        Every field is optional so a `PUT /repositories/{key}/security` can carry

        any subset of mutable columns; fields the client omits keep their existing

        value (or fall back to the documented default when the row does not exist

        yet). The previous shape required all of `scan_enabled`, `scan_on_upload`,

        `scan_on_proxy`, `block_on_policy_violation`, `severity_threshold` on every

        call. That was the #1374 bug class on a second entity: a partial PUT (for

        example just `{scan_enabled: true}`) either bounced as a 422 or, worse,

        silently reset every other column to its default so a follow-up GET showed

        the untouched fields stale. The upsert is now a read-modify-write that

        merges the patch over the existing row, so multiple fields persist together

        and an omitted field is never clobbered. See #1374 / B11.'
      properties:
        block_on_policy_violation:
          type:
          - boolean
          - 'null'
          description: 'Opt-in that makes `severity_threshold` enforced on the proxy/OCI

            inline scan gate (#3243/#3246). `false` (the default) does NOT mean

            "don''t block": it means the threshold is off and the gate blocks on

            ANY finding. To scan without ever blocking, set

            `proxy_scan_action = record_only`.'
        proxy_scan_action:
          type:
          - string
          - 'null'
          description: 'Inline proxy scan-on-fetch action: `''fail_open''` (default) |

            `''fail_closed''` (#2954) | `''record_only''` (#3645). `record_only` is

            the non-blocking mode: findings, SBOM and verdicts are recorded but no

            pull is ever blocked, whatever `block_on_policy_violation` /

            `severity_threshold` say. Any other value is rejected with 400.'
        scan_enabled:
          type:
          - boolean
          - 'null'
        scan_on_proxy:
          type:
          - boolean
          - 'null'
        scan_on_upload:
          type:
          - boolean
          - 'null'
        severity_threshold:
          type:
          - string
          - 'null'
          description: 'Severity floor for the inline proxy scan gate, live only when

            `block_on_policy_violation` is set (#3243/#3246).'
    UpstreamAuthRequest:
      type: object
      required:
      - auth_type
      properties:
        auth_type:
          type: string
          description: 'Auth type: "basic", "bearer", "aws_ecr", "aws_codeartifact", or "none"

            to remove.'
        aws:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AwsUpstreamAuthRequest'
            description: 'Provider settings for the dynamic AWS auth types (#1559). Required for

              `aws_ecr` and `aws_codeartifact`, ignored otherwise.


              Carries no secret: the AWS identity comes from the process''s default

              credential chain (IRSA / EKS Pod Identity / instance profile / static

              `AWS_*` environment keys), never from this request.'
        password:
          type:
          - string
          - 'null'
          description: Password (basic) or token (bearer). Write-only, never returned.
        username:
          type:
          - string
          - 'null'
          description: Username for basic auth.
    UpstreamFilter:
      type: object
      description: 'Upstream filter of a Remote repository, as stored and as exchanged over

        the API.'
      properties:
        exclude_patterns:
          type: array
          items:
            type: string
          description: 'A path matching any of these regexes is never fetched from upstream.

            Exclusion wins over inclusion.'
        include_patterns:
          type: array
          items:
            type: string
          description: 'If non-empty, a path is fetched from upstream only when it matches at

            least one of these regexes (search semantics; anchor with `^`/`$`).'
    UpstreamFilterResponse:
      type: object
      required:
      - repository_key
      - include_patterns
      - exclude_patterns
      - active
      properties:
        active:
          type: boolean
          description: 'Whether a filter is enforced (`false` when none is configured). A

            stored filter that can no longer be read is enforced as refuse-all, so

            it reports `true` with `error` set and both lists empty.'
        error:
          type:
          - string
          - 'null'
          description: 'Set when the stored filter is unusable (only possible after a direct

            database edit): every upstream fetch for this repository is refused

            until a valid filter is saved or the filter is deleted.'
        exclude_patterns:
          type: array
          items:
            type: string
          description: Paths matching any of these regexes are never fetched from upstream.
        include_patterns:
          type: array
          items:
            type: string
          description: 'When non-empty, only paths matching at least one of these regexes are

            fetched from upstream.'
        repository_key:
          type: string
    UserListResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserResponse'
