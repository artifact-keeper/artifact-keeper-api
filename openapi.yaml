  /api/v1/admin/packages/backfill:
    post:
      tags:
      - admin
      summary: Backfill the package catalog from existing artifacts (#3659).
      description: 'The native format handlers only started writing `packages` /

        `package_versions` when their catalog registration landed, so anything

        published before that upgrade is invisible on the Packages page until it is

        re-published. This replays those publishes through the very same upsert the

        handlers call, so it is idempotent and safe to run repeatedly.


        Deliberately synchronous and simple: it walks live artifact rows in pages

        and upserts as it goes. Requires admin privileges. An optional

        `repository_key` scopes the walk to one repository.'
      operationId: backfill_packages
      parameters:
      - name: repository_key
        in: query
        description: 'Restrict the walk to one repository. Omit to walk every hosted

          repository in a catalog-eligible format.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Backfill completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesBackfillResponse'
        '401':
          description: Admin privileges required
        '404':
          description: Repository not found
        '500':
          description: Internal server error
      security:
      - bearer_auth: []
  /api/v1/admin/proxy-scan-verdicts/{digest}:
    get:
      tags:
      - admin
      summary: Inspect the stored proxy scan verdict(s) for a content digest (#3244).
      description: 'The verdict store is content-addressed and GLOBAL across repositories and

        tenants (the same bytes are the same CVEs), which is why this surface is

        instance-admin only: no repo-scoped principal should read — let alone

        clear — a lever that spans every repo.'
      operationId: get_proxy_scan_verdicts
      parameters:
      - name: digest
        in: path
        description: 'Content digest: `sha256:<64 hex>` or bare 64-hex'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stored verdict rows for the digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyScanVerdictListResponse'
        '400':
          description: Malformed digest
        '403':
          description: Admin privileges required
        '404':
          description: No stored verdict for this digest
      security:
      - bearer_auth: []
    delete:
      tags:
      - admin
      summary: 'Invalidate (delete) the stored proxy scan verdict(s) for a content digest

        (#3244).'
      description: 'This forces RE-ASSESSMENT on the next pull — it is NOT a waiver. The next

        pull of the digest re-scans (inline under `fail_closed`, asynchronously

        under `fail_open`) and records a fresh verdict; a still-flagged image is

        immediately re-blocked. Only a stale verdict (advisory withdrawn, CVE-DB

        corrected) is durably cleared. Deleting by digest un-blocks that content

        EVERYWHERE (the store is global by design), hence instance-admin only.

        The deletion is audited with the removed rows'' verdict summary.'
      operationId: delete_proxy_scan_verdicts
      parameters:
      - name: digest
        in: path
        description: 'Content digest: `sha256:<64 hex>` or bare 64-hex'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted verdict rows (re-assessment forced on next pull)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyScanVerdictListResponse'
        '400':
          description: Malformed digest
        '403':
          description: Admin privileges required
        '404':
          description: No stored verdict for this digest
      security:
      - bearer_auth: []
  /api/v1/admin/quality-checks:
    get:
      tags:
      - quality
      summary: Admin list-all quality check results (#2419).
      description: 'Returns quality check results across all repositories/artifacts, newest

        first, filterable by `repository_id`, `artifact_id` and `status`, with

        `page`/`per_page` pagination and a total count. This powers the web admin

        quality-checks page, which needs a repository-scoped (or unscoped) view; the

        artifact-scoped `GET /quality/checks` (which 400s without `artifact_id`)

        remains the #2334 contract and is unchanged. Admin-only via the `/admin`

        `admin_middleware` and a defense-in-depth check here.'
      operationId: admin_list_checks
      parameters:
      - name: repository_id
        in: query
