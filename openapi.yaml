        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: q
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: path_prefix
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: group_by
        in: query
        description: "Server-side artifact grouping.\n\nSupported values:\n- `maven_component`: Maven/Gradle artifacts are\
          \ grouped by\n  groupId, artifactId, and version.  Individual files (jar, pom,\n  checksums) appear in the `artifact_files`\
          \ array of each component.\n- `docker_tag`: Docker/OCI artifacts are grouped by (image, tag),\n  with `total_size_bytes`\
          \ summed across the manifest config and\n  referenced layer blobs.  The grouped rows are returned in the\n  `docker_tags`\
          \ array."
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: cursor
        in: query
        description: 'Opaque keyset cursor (#2520, #2519, #2518). Pass the `next_cursor`

          value from the previous response to fetch the next page; `page` is

          ignored while a cursor is present. Supported by the flat artifact

          listing of hosted/local, virtual, and remote repositories (#2518,

          #2519), by `group_by=docker_tag`, and by `group_by=maven_component`

          on remote repositories; other listing modes ignore it.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: count
        in: query
        description: 'Total-count mode for keyset-paged listings (#2520, #2519).

          `count=exact` runs a dedicated COUNT query so `pagination.total` is

          exact; otherwise the keyset-paged listings report a cheap lower bound

          (rows seen so far, +1 when another page exists) and `has_more` is the

          authoritative "is there a next page" signal.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '404':
          description: Repository not found
