          description: 'Human-readable explanation when `healthy = false`. Safe to surface

            in the UI; does not leak credentials.'
        error_status:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Upstream HTTP status if the health probe got a response, else None.

            Only populated when `healthy = false`.'
