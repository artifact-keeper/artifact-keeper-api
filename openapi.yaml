  /api/v1/auth/ticket:
    post:
      tags:
      - auth
      summary: 'Create a short-lived, single-use download/stream ticket for the current user.

        The ticket can be passed as a `?ticket=` query parameter on endpoints that

        cannot use `Authorization` headers (e.g. `<a>` downloads, `EventSource` SSE).'
      description: 'Security note: the resulting ticket value will appear in webserver access

        logs, browser history, and `Referer` headers if it is embedded in a URL.

        The mitigation is single-use consumption plus a 30-second TTL plus 256-bit

        entropy. Clients should consume the ticket immediately and never share or

        log the URL that contains it.'
      operationId: create_download_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
        required: true
      responses:
        '200':
          description: Download ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid resource_path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
