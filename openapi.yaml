        source_ref:
          type:
          - string
          - 'null'
        source_type:
          type: string
        source_url:
          type:
          - string
          - 'null'
        status:
          type: string
        updated_at:
          type: string
          format: date-time
        version:
          type: string
    WebhookEvent:
      type: string
      description: Webhook event types
      enum:
      - artifact_uploaded
      - artifact_deleted
      - repository_created
      - repository_deleted
      - user_created
      - user_deleted
      - build_started
      - build_completed
      - build_failed
      - age_gate_queued
      - age_gate_approved
      - age_gate_rejected
      - age_gate_reopened
    WebhookListResponse:
