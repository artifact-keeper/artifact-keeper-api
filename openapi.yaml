  /api/v1/repositories/{key}/security/proxy-sbom:
    get:
      tags:
      - sbom
      summary: Generate an SBOM for a proxy-cached artifact, on demand.
      description: 'Proxy-cached content has no `artifacts` row (#1278/#1280), so it cannot be

        served by the artifact-keyed SBOM handlers and nothing is persisted in

        `sbom_documents`. The document is regenerated per request from the package

        inventory the inline proxy scan recorded, which is why this endpoint has no

        SBOM id, no listing, and no delete.'
      operationId: get_proxy_sbom
      parameters:
      - name: path
        in: query
        description: 'Cache path within the calling repository.


          Path-keyed, never digest-keyed: verdicts and inventories are stored by

          content digest and are therefore global, so accepting a digest would

          turn this into a cross-tenant lookup oracle. A path is inherently

          scoped to the repository that cached it.'
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: '`cyclonedx` (default) or `spdx`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: key
        in: path
        description: Repository key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SBOM document for the cached artifact
        '401':
          description: Authentication required
        '404':
          description: Path unknown, or no inventory recorded
